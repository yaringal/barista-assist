      translation_key: grind
      token: __GRIND__
      min: 0.0
      max: 100.0
      step: 0.5
      mode: box
      requires_bag: true

    target_yield:
      source: bag
      field: target_yield_g
      translation_key: target_yield
      token: __TARGET_YIELD__
      min: 15.0
      max: 80.0
      # 3.0, not 2.5: runtime._validate_recipe_field requires
      # (value - min) / step to land exactly on a whole number, and the
      # default recipe's target_yield_g (defaults.recipe above) is 36.0 -
      # (36.0 - 15.0) / 2.5 = 8.4, which fails that check and made every
      # new bag (which validates its recipe defaults on creation) reject
      # its own starting yield. 3.0 divides (36.0 - 15.0) evenly and is
      # still within Hoffmann's original 2-3g ceiling for a yield
      # fine-tune (docs/DESIGN.md section 6.3) - the wider 5-10g figure is
      # expert_rules.flavor_correction.tags.sharp_sour's own delta_g, a
      # separate value from this UI increment.
      step: 3.0
      unit: g
      mode: box
      requires_bag: true

