# Declarative source of truth for Barista Assist user-facing controls.
# Runtime/Bluetooth/database algorithms intentionally remain in Python.
version: 1

slots:
  - normal
  - decaf

defaults:
  recipe:
    dose_g: 18.0
    grind: 15.0
    target_yield_g: 36.0
    temperature_offset_c: 0
    preinfusion_s: 7
  controller:
    early_stop_margin_min_g: 1.5
    early_stop_margin_max_g: 20.0
    safety_margin_s: 3
    machine_max_shot_s: 50
    machine_pi_s: 8.0
    adapt_pi: true
    stop_latency_normal_s: 3.4
    stop_latency_elevated_s: 4.3
  new_bag:
    starting_mass_g: 250.0

# Every tunable threshold flow_analysis.py's Stage-1 classifier uses, in one
# place - runtime.py builds a flow_analysis.FlowAnalysisConfig from this dict
# on every shot (see _async_finalize). FlowAnalysisConfig itself has no
# default values and no explanatory comments (consts live in yaml, code is
# for logic) - this is the only place both the numbers and the reasoning
# behind them live at all.
#
# Most of the fields below are signal-processing/plausibility thresholds,
# each tuned against a specific real anomalous shot a human diagnosed by
# inspecting the raw trace - see each field's own comment for its incident.
# Getting these better calibrated needs more real recorded edge cases for a
# human to review, not just more shot volume - there's no automatic ground
# truth for "was this really a disturbance" the way there is for e.g.
# stop_latency's tail-weight error. expected_flow_g_s/too_fast_factor/
# too_restrictive_factor further below are the ones with a real derivation
# behind their current values instead.
flow_analysis_constants:
  # Fewer than this many samples can't be classified at all - not enough
  # points to smooth/derive a trend from. Arbitrary, not tuned against any
  # specific incident.
  min_samples: 5

  # A bag needs at least this many recorded healthy shots before its own
  # baseline (median late-shot acceleration) is trusted for the
  # baseline-deviation channeling check - too few, and one atypical healthy
  # shot could dominate the "normal for this bag" reference point.
  # Arbitrary, not tuned against any specific incident.
  min_baseline_shots: 3

  # The derivative must clear this many g/s to count as real flow at all,
  # as opposed to scale noise around zero. Arbitrary, not tuned against any
  # specific incident.
  first_flow_threshold_g_s: 0.3

  # Centered moving-average window applied to raw weight before computing
  # flow (the derivative) - trades detail for noise rejection. Arbitrary,
  # not tuned against any specific incident.
  smoothing_window_ms: 500

  # A single sample's derivative can spike past first_flow_threshold_g_s
  # purely from scale quantization (e.g. a 0.1g-resolution reading landing
  # right at a sample boundary) even during a genuine low/no-flow trickle -
  # real flow stays above the threshold for a run of samples, not just one,
  # so "first flow" requires the crossing to hold for at least this long.
  first_flow_sustain_ms: 300

  # A raw weight reading this many grams below its own running peak so far
  # is treated as the cup or scale having been disturbed, not real flow:
  # weight can only rise while coffee is actually being collected, so any
  # meaningful drop - however it happens, whenever it happens - means
  # everything from that point on isn't trustworthy. Everything before it
  # still is.
  max_plausible_weight_drop_g: 0.5

  # Disturbance detection only arms once the running peak has cleared this
  # floor. Below it - typically pre-infusion, before any real coffee mass
  # has accumulated - scale settling noise alone can span several tenths of
  # a gram, comfortably exceeding max_plausible_weight_drop_g on its own
  # with no real disturbance involved; a real shot found this live,
  # misclassifying a genuine ~50g pour as invalid because of a sub-gram dip
  # minutes before the real pour even began. Once a shot has genuinely
  # accumulated this much weight, the same max_plausible_weight_drop_g drop
  # is unambiguous interference, exactly as before.
  disturbance_detection_floor_g: 2.0

  # A drop past max_plausible_weight_drop_g must hold for at least this long
  # to count as a genuine disturbance rather than a splash/settle bounce - a
  # real shot with a violent, turbulent gush saw repeated multi-gram dips
  # (droplets, crema settling, the cup rocking on the scale) that each
  # recovered and kept climbing within a few hundred ms, but the first one
  # hit the old instantaneous check and truncated the shot down to its
  # first ~9s, hiding the huge overshoot that followed and turning an
  # obviously too-fast shot into a false too_restrictive (t90 never reached
  # in the truncated data). A genuine cup-lift stays low far longer than
  # this.
  disturbance_sustain_ms: 1000

  # A leading weight reading this far below zero is scale noise before it's
  # settled/tared, not real data - weight is never meaningfully negative,
  # at any point in a shot (ordinary scale jitter near a true zero baseline
  # stays within a couple tenths of a gram either way). A live shot hit a
  # single -48g first sample (elapsed_ms=22, one reading before the scale
  # had connected/tared) that dragged the whole smoothing/derivative
  # computation with it, misclassifying an otherwise perfectly normal (if
  # too-fast) shot as invalid_measurement. This must only ever reject on
  # the negative side - a legitimately high leading *positive* reading
  # (e.g. synthetic test data, or real samples that only start once a pour
  # is already well underway) is not implausible the same way and must
  # never be discarded.
  leading_garbage_threshold_g: 2.0

  # A leading sample whose scale_ms (the BOOKOO scale's own onboard clock)
  # runs this many ms ahead of our own elapsed_ms is a stale BLE
  # notification queued from before our tare-and-start-timer command reset
  # the scale's clock, not real data for this shot - a live shot's first
  # two samples read scale_ms=19200 while elapsed_ms was still under 200,
  # carrying a stale, unrelated 12g reading left over from whatever the
  # scale was doing before this shot. Once the scale's own clock is reset,
  # its readings drop back to roughly tracking elapsed_ms, so this only
  # ever rejects genuinely stale leading samples, not real ones.
  stale_scale_clock_threshold_ms: 2000

  # A shot's first detected flow earlier than this fraction of its
  # configured pre-infusion duration is implausible - pre-infusion is meant
  # to be a low/no-flow soak. Unvalidated placeholder, same status as the
  # signal-processing group above.
  early_flow_fraction_of_preinfusion: 0.5

  # channeling_suspicion at or above this value classifies puck_prep_issue
  # rather than by the shot's hydraulic fast/slow reading (docs/DESIGN.md
  # section 13 Stage 1). Unvalidated guess, not checked against any of the
  # dial-in videos (they describe channeling qualitatively - "a sudden rise
  # in flow" - never with a numeric suspicion-score equivalent).
  suspicion_threshold: 0.6

  # Fixed prior: mid- or late-shot flow accelerating upward by this many g/s
  # per second is treated as maximally suspicious, independent of any
  # baseline. Same status as suspicion_threshold above - unvalidated.
  absolute_accel_limit_g_s2: 1.0

  # How many "pseudo-shots" the expected_flow_g_s prior below is worth when
  # blending with a bag's own healthy-shot history - shrinks toward the
  # bag-specific median as shot_count grows. Unvalidated placeholder.
  prior_weight_shots: 1.0

  # expected_flow_g_s: the flow rate (target_yield_g / total shot seconds,
  # t90-ish) a "normal" shot is expected to run at, before any per-bag
  # history exists (flow_analysis blends this with the bag's own recent
  # median as shots accumulate - see flow_analysis._blended_expected_flow_g_s,
  # unaffected by this change). too_fast_factor/too_restrictive_factor
  # bound how far duration_s may deviate from expected_s (=
  # target_yield_g / expected_flow_g_s) before a shot leaves "healthy":
  # too_fast if duration_s < expected_s * too_fast_factor, too_restrictive
  # if duration_s > expected_s * too_restrictive_factor.
  #
  # The values below replace flow_analysis.py's original placeholders of
  # 1.25 / 0.8 / 1.6 (themselves anchored only to DESIGN.md's own
  # hand-written Example A, not to anything Hoffmann actually said - see
  # docs/DIAL_IN_RULES.md and the "design-doc-is-not-source-
  # of-truth" lesson from that research). These were checked directly
  # against every dose/yield/time data point across the dial-in videos
  # that Hoffmann himself gave an explicit good/bad verdict on -
  # converted to flow_g_s = yield_g / time_s, then to
  # duration_ratio = expected_flow_g_s / actual_flow_g_s (equivalent to
  # duration_s / expected_s for a fixed yield):
  #
  #   source                          yield/time      flow_g_s  duration_ratio  verdict
  #   Dial-In Ep1 shot 1              40g / 34s        1.176      1.105         "too slow" (harsh/muddy/sour)
  #   Dial-In Ep1 shot 2              38g / 25s        1.520      0.855         "too fast" (under-extracted)
  #   Dial-In Ep1 shot 3              38g / 27s        1.407      0.924         improving, not flagged as fast/slow
  #   Dial-In Ep1 shot 4 ("pretty good") 38.5g / 29s    1.328      0.979         accepted
  #   Grind Size ep's own "good" example 36g / 30s      1.200      1.083         stated as the target to hit
  #   Dial-In Ep2 baseline             40g / ~29s       1.379      0.943         not flagged as fast/slow (issue was flavour/temp)
  #   Dial-In Ep2 after adjustment     ~37g / ~30s      1.233      1.054         "hit the numbers", fine
  #
  # (expected_flow_g_s = 1.3 used to compute duration_ratio above.) The
  # bad-verdict points (1.105, 0.855) and every accepted/unflagged point
  # (0.924-1.083) separate cleanly at roughly 0.88 and 1.10 - notably,
  # the old 1.6 factor is nowhere close to catching Ep1 shot 1's 1.105,
  # despite Hoffmann calling that shot too slow outright. This is a small
  # (7-point), spoken-approximate-timing dataset from one creator's
  # equipment, not this installation's own instrumented shot history, so
  # treat it the same way as any other placeholder in this file: a better-
  # grounded starting point than an invented example, still to be replaced
  # once Phase 3b/4b's real recorded shots exist.
  expected_flow_g_s: 1.3
  too_fast_factor: 0.88
  too_restrictive_factor: 1.10

# Expert-system correction rules (DESIGN.md §13-15), consolidated from James
# Hoffmann's dial-in videos - see docs/DIAL_IN_RULES.md for the
# full per-video sourcing and open questions. This encodes *policy* (which
# lever to pull, in what order, by how much) as data; the diagnostic math
# that produces a shot's classification/duration_ratio stays in
# flow_analysis.py, matching this file's own header: algorithms stay in
# Python, tunable behaviour lives here. flow_analysis_constants above is a
# similar idea but for flow_analysis.py's own internal thresholds rather
# than the barista-facing correction policy below.
expert_rules:

  # Corrects a shot's flow-rate deviation by moving grind only, holding
  # every other recipe variable constant (DESIGN.md §13 Stage 2 - "isolate
  # variables", from the Grind Size video's rule 3). Never applied to a
  # puck_prep_issue or invalid_measurement shot: channeling has two distinct
  # causes in the source videos (bad puck prep vs. grind ground too fine for
  # the pressure/prep quality being used) and flow_analysis.py can't yet tell
  # them apart from the weight curve alone, so defaulting to "repeat the
  # recipe, don't touch grind" is the safe choice until it can.
  #
  # TODO, queued: that "repeat, don't touch grind" default is applied the
  # same way no matter how many consecutive shots at this recipe have come
  # back puck_prep_issue - nothing tracks the streak or reconsiders the
  # exclusion once it's happened repeatedly, even though a recurring result
  # is evidence against "one-off bad tamp" and toward "grind genuinely too
  # fine for this recipe" (see flow_analysis.py's classification TODO and
  # docs/DESIGN.md §12).
  grind_correction:
    applies_to_classification: [too_fast, too_restrictive]
    excludes_classification: [puck_prep_issue, invalid_measurement]
    hold_constant: [dose_g, target_yield_g, temperature_offset_c, preinfusion_s]
    # duration_ratio = actual shot duration / expected duration for this bag,
    # using flow_analysis_constants.expected_flow_g_s above. Below 1.0 = ran
    # fast; above 1.0 = ran slow/restrictive. Bands are ordered ascending by
    # duration_ratio_max; a shot's duration_ratio picks the first band whose
    # max it is <= to (grossly_restrictive, with no max, catches anything
    # above moderately_restrictive's). The healthy band's own edges
    # (0.88/1.10) are the video-sourced values derived above; the finer
    # slightly/moderately/grossly tiers beyond that boundary are still
    # placeholder anchors, not derived data - none of the videos give
    # numeric ratios for "moderately" vs "grossly" off, only qualitative
    # language ("way too fast" vs "a little bit finer"). Revisit alongside
    # Phase 3b/4b once real shot history exists to calibrate them.
    bands:
      - name: grossly_fast
        duration_ratio_max: 0.6
        grind_delta: -2.0
      - name: moderately_fast
        duration_ratio_max: 0.75
        grind_delta: -1.0
      - name: slightly_fast
        duration_ratio_max: 0.88
        grind_delta: -0.5
      - name: healthy
        duration_ratio_max: 1.10
        grind_delta: 0.0
      - name: slightly_restrictive
        duration_ratio_max: 1.30
        grind_delta: 0.5
      - name: moderately_restrictive
        duration_ratio_max: 1.60
        grind_delta: 1.0
      - name: grossly_restrictive
        duration_ratio_max: null
        grind_delta: 2.0

  # Phase 5 reference only - not yet consumed by any controller/runtime code.
  # Tags match DESIGN.md §13's own sensory-tag list, but the lever mapped to
  # each tag is only as trustworthy as its source: where a James Hoffmann
  # video independently states the same fix, that's noted below and treated
  # as the stronger claim; where a mapping only comes from DESIGN.md's own
  # (pre-video-research, hand-written) examples, that's noted too - DESIGN.md
  # is not treated as a source of truth here, it's the thing this research
  # was meant to check. See docs/DIAL_IN_RULES.md.
  #
  # Cross-checked against Lance Hedrick's and Matt Perger's videos too (see
  # docs/CROSS_CREATOR_RULE_CHECK.md); adjustments below are annotated
  # "cross-creator". Weighted for genuine consensus/mechanism over any one
  # creator's personal preference: Lance's self-described personal biases
  # (e.g. "I always prefer to go coarser", rejecting fixed time windows
  # despite using them himself in two of his own other videos, changing
  # grind and contact time together instead of isolating grind) were
  # deliberately NOT incorporated anywhere in this file - see
  # docs/CROSS_CREATOR_RULE_CHECK.md's "queued decisions" for why each one
  # was left out. What did get incorporated below either matches across
  # multiple independent sources or is a stated mechanism, not an opinion.
  flavor_correction:
    lever_order: [yield, temperature, dose, preinfusion]
    # A single shot's taste tag shouldn't trigger a correction on its own
    # (Brew Temperature ep: "time and time and time again", not one shot -
    # shot-to-shot variation and bean heterogeneity can produce a false
    # signal). Applies to flavour tags; flow-classification-driven grind
    # corrections above are exempt since duration_ratio is measured directly,
    # not self-reported.
    require_persistent_pattern_shots: 2
    minimum_meaningful_step:
      temperature_offset_c: 1
      dose_g: 0.5
      target_yield_g: 2.5
    tags:
      sour_sharp:
        lever: yield
        direction: increase
        delta_g: [5, 10]
        # Direction matches DESIGN.md's own Example B. Magnitude was
        # originally 2-3g (Hoffmann's "Ratio" ep - his own stated ceiling
        # before a yield tweak starts changing the drink's style), but
        # cross-creator: three independent worked examples (Lance Hedrick's
        # "Fix Sour Espresso" - "five, eight, maybe ten grams more"; Lance's
        # "Quick & Easy Guide" - demonstrated +5g; Matt Perger - +10g, a 25%
        # jump) all use noticeably bigger jumps than Hoffmann's own stated
        # ceiling, so this was widened to 5-10g. This isn't "trust Lance
        # over Hoffmann" - Perger's independent +10g example is what tips it;
        # a 3-source majority against Hoffmann's single stated ceiling.
        escalation:
          # Video-sourced (Brew Temperature ep): only escalate to
          # temperature once the taste issue is confirmed to persist across
          # shots, not from a single one, and only after ratio has already
          # been tried. If a milk drink comes out too weak as a result,
          # DESIGN.md's Example C additionally says to return yield toward
          # its prior value before trying +1°C rather than stacking both
          # changes - that sequencing detail is DESIGN.md's own, not
          # independently stated in the transcripts.
          condition: persists_after_yield_change
          lever: temperature
          direction: increase
      bitter_harsh:
        # Cross-creator reorder: previously mapped straight to temperature.
        # Lance Hedrick's "Quick & Easy Guide" ("if it's watery, it's
        # bitter, it's drying... lower [the ratio], that's probably
        # over-extraction") puts yield/ratio decrease first, with
        # temperature only mentioned as a secondary aside for machines that
        # support it ("Understanding Variables": "most people don't have
        # the capability... I wouldn't sweat it"). This isn't a new
        # principle - it matches Hoffmann's own stated rule to try ratio
        # before temperature for any taste issue - this tag just hadn't
        # been updated to reflect that ordering the way sour_sharp's
        # escalation already was. Fixing an internal inconsistency, not
        # adopting a new claim.
        lever: yield
        direction: decrease
        # No delta_g on purpose - unlike sour_sharp's increase direction
        # (2-3g Hoffmann, widened to 5-10g against three independent
        # worked examples above), nothing in any of the 16 transcripts
        # states a magnitude for the DECREASE direction: every source that
        # discusses pulling back yield for bitterness/over-extraction gives
        # direction only ("lower it", "return yield toward its prior
        # value"), never a number. Adding one here would be a guess, not a
        # sourced figure - falls back to this block's own
        # minimum_meaningful_step.target_yield_g (2.5g) instead of
        # inventing a dedicated value.
        escalation:
          condition: persists_after_yield_change
          lever: temperature
          direction: decrease
        note: "distinguish from dirty-machine bitterness (a lingering, burned flavour) - that is not a recipe fix"
        # Cross-creator qualifier, corroborated independently in two Lance
        # Hedrick videos ("Dialing In By Taste", "Understanding Variables"):
        # darker roasts produce more fines, and fines are inherently
        # bitter - so a shot can taste bitter while actually being
        # UNDER-extracted (via channeling), which this tag's yield-decrease
        # fix would make worse, not better. Stated distinguishing signal:
        # true over-extraction bitterness comes together with
        # wateriness/dryness; fines-driven bitterness doesn't necessarily.
        # If bitter appears WITHOUT watery/drying, this may not be the
        # right tag at all - check for puck_prep_issue/channeling first
        # rather than assuming over-extraction.
        fines_caveat: "bitter without accompanying watery/drying mouthfeel may be under-extraction/channeling, not over-extraction - do not apply this tag's fix in that case"
      thin_weak:
        lever: dose
        direction: increase
        delta_g: 0.5
        # Sourced from DESIGN.md §13 ("good flavour but too weak -> small
        # dose increase"), corroborated independently by the Dose video's
        # own 0.5g micro-tweak figure.
        note: "a small dose increase (about 0.5g) is the standard fix for a shot that already tastes good but comes across underpowered or weak"
      dry_astringent:
        # Previously unmapped ("no Stage-3 lever identified... left unmapped
        # pending more data"). Cross-creator: now has real evidence. Lance
        # Hedrick's "Quick & Easy Guide" pairs "watery and drying and
        # bitter" together as the over-extraction signature (fix: lower
        # ratio); Matt Perger's diminishing-returns finding independently
        # arrives at the same place from grind - pushing grind past its
        # peak makes mouthfeel "dry" while extraction and strength both
        # drop. Two different levers, same diagnosis (over-extraction),
        # from two independent sources.
        lever: yield
        direction: decrease
        # Same gap as bitter_harsh, and for the same reason: no source
        # gives a magnitude for this direction, only "lower it"/"back off".
        # Falls back to minimum_meaningful_step.target_yield_g (2.5g)
        # rather than a guessed delta_g.
        
        # When this tag appears alongside thin or watery mouthfeel (true over-extraction): decrease yield first. If the over-extraction is actually caused by a grind pushed too fine rather than a ratio problem, back off the grind instead - this tag alone doesn't distinguish which lever caused it, only that yield or grind should move toward less extraction.
      balanced:
        note: "all good - no action"

  # Phase 5/6 reference only - not yet consumed by any code. DESIGN.md §19's
  # warm-start logic only matches against a "similar coffee" today; it
  # doesn't use a new bag's coffee.roast_level (§16 - already modeled,
  # already collected, just unused for this) as a prior for anything.
  # Cross-creator: two independent Lance Hedrick videos ("Quick & Easy
  # Guide" and "Mystery Roast") agree closely on a starting ratio by roast
  # level, so this is a reasonable candidate warm-start prior once a bag
  # has no shot history of its own (or no similar-coffee match) to fall
  # back on.
  #
  # Cross-checked against Hoffmann's own actual dial-in results (the only
  # two videos with both a stated roast level AND a final numeric recipe):
  # Dial-In Ep1, light roast, ended at 17g -> 42g (1:2.47); Dial-In Ep2,
  # medium roast, ended at 19g -> 36-38g, which Hoffmann himself calls "the
  # classic two to one ratio" (~1:1.9-2.0). Lance's medium=2.5 doesn't hold
  # up against that - Hoffmann's actual medium result sits closer to
  # Lance's DARK tier than his medium one. medium was lowered from 2.5
  # toward that result; not moved all the way to 2.0 because that would
  # collapse it onto the dark tier and lose the ordering (dark < medium <
  # light) this prior exists to encode, and because a single Hoffmann data
  # point plus Lance's stated table isn't enough to pin an exact number,
  # only enough to say 2.5 was too high. light (3.0) hasn't been re-checked
  # the same way - Hoffmann's light-roast result (2.47) is itself below
  # Lance's light tier (3.0+, stated as open-ended, not a ceiling), so that
  # tier may be optimistic too, but with only one Hoffmann light-roast data
  # point and Lance's own explicit "and above" hedge, there isn't a clear
  # correction to make there yet - flagging rather than guessing.
  #
  # Worth weighing all of this lightly regardless of the exact numbers:
  # Hoffmann's own "Episode 0" is an extended argument against exactly this
  # kind of simplification - "not all two-to-ones are created equal" - his
  # stated position is that ratio depends on dose, basket, grinder, and
  # water at least as much as roast level. This prior is a low-confidence
  # fallback for when nothing else is available, not a validated rule.
  roast_level_ratio_prior:
    dark: 2.0
    medium: 2.2
    light: 3.0
    # Both Lance sources are explicit these are loose starting points, not
    # fixed targets: "Mystery Roast" ends its actual dark-roast dial-in
    # below 1:2 once tasted ("we ended up below one to two because that's
    # where it tasted best"), and "Quick & Easy Guide" gives light roast as
    # "1:3 and above" (open-ended, not a ceiling). Use only to seed
    # target_yield_g for a brand-new bag; a bag's own accepted shots should
    # override this immediately, the same way flow_analysis_constants'
    # expected_flow_g_s prior yields to a bag's own history.

entities:
  sensor:
    status:
      source: runtime
      field: status
      translation_key: status
      token: __STATUS__
      attributes: [scale_connected, selected_slot, early_stop_margin_min_g, early_stop_margin_max_g, shot_plot]

    stop_latency_normal:
      source: controller
      field: stop_latency_normal_s
      translation_key: stop_latency_normal
      token: __STOP_LATENCY_NORMAL__
      unit: s
      precision: 2

    stop_latency_elevated:
      source: controller
      field: stop_latency_elevated_s
      translation_key: stop_latency_elevated
      token: __STOP_LATENCY_ELEVATED__
      unit: s
      precision: 2

    scale_weight:
      source: scale
      field: weight_g
      translation_key: scale_weight
      unit: g
      device_class: weight
      state_class: measurement
      precision: 1
      requires_scale: true

    scale_battery:
      source: scale
      field: battery_percent
      translation_key: scale_battery
      token: __SCALE_BATTERY__
      unit: "%"
      device_class: battery
      state_class: measurement
      requires_scale: true

    active_bag:
      source: bag
      field: coffee_name
      translation_key: active_bag
      token: __ACTIVE_BAG__
      attributes:
        - slot
        - bag_id
        - roaster
        - roast_date
        - opened_at
        - dose_g
        - grind
        - target_yield_g
        - temperature_offset_c
        - preinfusion_s
        - remaining_g

    last_yield:
      source: last_shot
      field: actual_yield_g
      translation_key: last_yield
      token: __LAST_YIELD__
      unit: g
      device_class: weight
      precision: 1

    shot_classification:
      source: last_shot
      field: classification
      translation_key: shot_classification
      token: __SHOT_CLASSIFICATION__

    shot_channeling_suspicion:
      source: last_shot
      field: channeling_suspicion
      translation_key: shot_channeling_suspicion
      token: __SHOT_CHANNELING_SUSPICION__
      state_class: measurement
      precision: 2

    recommended_grind:
      # Phase 4 (docs/DESIGN.md section 28) - a human-readable "current
      # setting -> recommended setting" note (e.g. "15.0 -> 14.0"), computed
      # in BaristaRuntime.entity_value from the last shot's own recorded
      # grind setting (shots.grind - the value that shot actually ran at,
      # not whatever the bag's live grind happens to be now if it's since
      # been changed for an unrelated reason) plus grind_correction.py's
      # recommend_grind_delta() output (persisted as shots.
      # recommended_grind_delta - see storage.finalize_shot). None/
      # unavailable when the last shot wasn't a grind-correction candidate
      # (healthy, or excluded as puck_prep_issue/invalid_measurement) -
      # that's a real "no recommendation" state, not a fault. field is a
      # virtual name (not a real shots column) that entity_value
      # special-cases, the same way source: bag's remaining_g does.
      source: last_shot
      field: recommended_grind_note
      translation_key: recommended_grind
