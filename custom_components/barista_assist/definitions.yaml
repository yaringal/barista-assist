# Declarative source of truth for Barista Assist's tunable workflow
# constants - recipe/controller defaults, flow-classification thresholds,
# and expert-system policy (grind/flavor correction, roast-level priors) -
# so they can be tuned without touching Python. Which Home Assistant
# entities exist and how they render (translation keys, dashboard tokens,
# units, widget bounds) lives in entities.yaml instead; runtime/Bluetooth/
# database algorithms themselves intentionally remain in Python.
version: 1

slots:
  - normal
  - decaf

defaults:
  recipe:
    dose_g: 18.0
    grind: 15.0
    target_yield_g: 36.0
    temperature_offset_c: 0
    preinfusion_s: 7
  controller:
    early_stop_margin_min_g: 1.5
    early_stop_margin_max_g: 20.0
    safety_margin_s: 3
    machine_max_shot_s: 50
    machine_pi_s: 8.0
    adapt_pi: true
    stop_latency_normal_s: 3.2
    stop_latency_elevated_s: 4.3
    # Delay before sending taste-feedback push notifications - long enough
    # to taste the drink, short enough to stay fresh in memory. Not
    # dashboard-editable; a one-off UX knob, not a live-recalibrated one.
    flavor_feedback_delay_s: 120
  new_bag:
    starting_mass_g: 250.0

# =============================================================================
# flow_analysis_constants - every tunable threshold flow_analysis.py's Stage-1
# classifier uses. FlowAnalysisConfig has no defaults of its own (consts
# live in yaml, code is for logic) - this is the only place the numbers and
# their reasoning live. Grouped to match flow_analysis.py's own section
# order (leading-garbage -> disturbance -> smoothing/first-flow ->
# channeling suspicion -> flow-rate classification).
# =============================================================================
flow_analysis_constants:

  # --- Leading-garbage detection ---------------------------------------------

  # A leading reading this far below zero is scale noise before it's
  # settled/tared, not real data (weight is never meaningfully negative) -
  # a live shot's stray -48g first sample once dragged the whole
  # smoothing/derivative computation with it, misclassifying an otherwise
  # normal shot. Only ever rejects the negative side.
  leading_garbage_threshold_g: 2.0

  # A leading sample whose scale_ms runs this far ahead of elapsed_ms is a
  # stale BLE notification queued from before our tare/start-timer command
  # reset the scale's clock, not real data - seen live (scale_ms=19200
  # while elapsed_ms<200, carrying a stale unrelated 12g reading).
  stale_scale_clock_threshold_ms: 2000

  # --- Mid-shot disturbance detection (cup/scale bumped, lifted, moved) ------

  # A raw weight this many grams below its own running peak is a cup/scale
  # disturbance, not real flow - weight can only rise during a real pour,
  # so any meaningful drop makes everything after it untrustworthy.
  max_plausible_weight_drop_g: 0.5

  # Disturbance detection only arms once the running peak clears this
  # floor - below it (pre-infusion), scale settling noise alone can exceed
  # max_plausible_weight_drop_g with no real disturbance; a real shot once
  # misclassified a genuine ~50g pour this way.
  disturbance_detection_floor_g: 2.0

  # A drop past max_plausible_weight_drop_g must hold this long to count as
  # a real disturbance, not a splash/settle bounce - a violent, turbulent
  # real shot saw repeated sub-second dips that each recovered; the old
  # instantaneous check truncated it at ~9s and hid the real overshoot.
  disturbance_sustain_ms: 1000

  # --- Smoothing & first-flow detection --------------------------------------

  # Fewer than this many samples can't be classified - not enough points to
  # derive a trend from. Arbitrary, not incident-tuned.
  min_samples: 5

  # A final weight below this is a broken/disconnected shot
  # (NEAR_ZERO_FINAL_WEIGHT), not a real near-empty pour - same
  # plausibility-floor idea as leading_garbage_threshold_g, at the shot's end.
  near_zero_final_weight_threshold_g: 1.0

  # Centered moving-average window for smoothing weight before computing
  # flow. Arbitrary, not incident-tuned.
  smoothing_window_ms: 500

  # The derivative must clear this many g/s to count as real flow, not
  # scale noise. Arbitrary, not incident-tuned.
  first_flow_threshold_g_s: 0.3

  # A single sample can spike past first_flow_threshold_g_s from scale
  # quantization alone - real flow must hold above it for this long. 300ms
  # was too short: too_fast_but_flagged_invalid_adapt_pi (a real fixture,
  # tests/fixtures/real_shots/) has a ~300ms noise wobble near the tare
  # baseline (raw weight oscillating between -0.5g and -0.1g - nowhere near
  # real flow) whose smoothed derivative happened to clear
  # first_flow_threshold_g_s for exactly 300ms, wrongly tripping
  # flow_started_before_preinfusion_end. 400ms already fixes it; 600ms
  # (chosen for margin, not because 400 was insufficient) makes zero
  # difference to any other real fixture's classification across the whole
  # tested range 300-1200ms - see
  # tests/test_flow_analysis_real_shots.py's
  # TooFastButFlaggedInvalidAdaptPiTests.
  first_flow_sustain_ms: 600

  # First detected flow earlier than this fraction of preinfusion_s is
  # implausible (pre-infusion should be a low/no-flow soak). Placeholder.
  early_flow_fraction_of_preinfusion: 0.5

  # --- Channeling suspicion ---------------------------------------------------
  # All three below are unvalidated guesses - no automatic ground truth for
  # "was this really channeling" exists, and none of the 16 dial-in videos
  # this project checked describe channeling numerically (only
  # qualitatively - "a sudden rise in flow", "tiger striping").

  # A bag needs at least this many healthy shots before its own baseline
  # (median late-shot accel) is trusted - too few, and one atypical shot
  # could dominate the "normal for this bag" reference.
  min_baseline_shots: 3

  # channeling_suspicion at or above this classifies puck_prep_issue rather
  # than by the shot's fast/slow flow reading (DESIGN.md §13 Stage 1).
  suspicion_threshold: 0.6

  # Fixed prior: mid/late-shot flow accelerating upward by this many g/s²
  # is maximally suspicious, independent of any baseline.
  absolute_accel_limit_g_s2: 1.0

  # Baseline-deviation suspicion (bag-relative counterpart to
  # absolute_accel_limit_g_s2): rise_above_baseline / (reference *
  # baseline_deviation_scale), reference = this bag's own median late-shot
  # accel, floored at baseline_deviation_floor_g_s2 to avoid blowing up a
  # near-zero baseline.
  baseline_deviation_floor_g_s2: 0.1
  baseline_deviation_scale: 3.0

  # --- Flow-rate classification (the Hoffmann-calibrated trio) ---------------

  # How many "pseudo-shots" the expected_flow_g_s prior (and
  # roast_level_ratio_prior/roast_level_dose_prior in expert_rules) is
  # worth when blending toward this installation's own accumulated data for
  # the same roast_level - never toward one bag's own history (DESIGN.md
  # §19/Phase 3b). One shared shrinkage weight, not one per prior. Placeholder.
  prior_weight_shots: 1.0

  # expected_flow_g_s: the extraction-phase (post-pre-infusion) flow rate a
  # "normal" shot runs at before this installation has its own roast-level
  # history (blended with other bags' median flow as it accumulates -
  # blended_expected_flow_g_s; never toward this bag's own history).
  # too_fast_factor/too_restrictive_factor bound how far duration_s
  # (measured from press time, so it includes pre-infusion) may deviate
  # from expected_s = preinfusion_s + target_yield_g / expected_flow_g_s
  # before a shot leaves "healthy" - the added preinfusion_s budgets that
  # same dead time on the expected side instead of comparing a PI-inclusive
  # duration against a PI-free expectation. Every value blended against or
  # derived from this constant (RoastLevelFlowBaseline.median_flow_g_s,
  # storage.roast_level_baseline's own query) must stay this same
  # post-pre-infusion quantity - blending in a raw button-to-90%-yield rate
  # would silently reintroduce the double-counted-pre-infusion bias this
  # formula exists to avoid.
  #
  # Unlike everything else in this file, these three have a real derivation:
  # checked against every Hoffmann dial-in data point with an explicit
  # good/bad verdict. Hoffmann never states each shot's own pre-infusion
  # duration, so a uniform 7s was assumed for all seven (matching both this
  # project's own preinfusion_s default and his general "6-8s to first flow"
  # guidance in "Understanding Espresso - Pressure") to back out an
  # extraction-only flow_g_s = yield / (time - 7) and expected_flow_g_s was
  # then solved for so duration_ratio = time / (7 + yield / expected_flow_g_s)
  # separates the good/bad verdicts at the existing 0.88/1.10 cutoffs:
  #
  #   source                             yield/time  flow_g_s  duration_ratio  verdict
  #   Dial-In Ep1 shot 1                 40g / 34s    1.481      1.114         "too slow" (harsh/muddy/sour)
  #   Dial-In Ep1 shot 2                 38g / 25s    2.111      0.852         "too fast" (under-extracted)
  #   Dial-In Ep1 shot 3                 38g / 27s    1.900      0.920         improving, not flagged
  #   Dial-In Ep1 shot 4 ("pretty good") 38.5g / 29s  1.750      0.978         accepted
  #   Grind Size ep's own "good" example 36g / 30s    1.565      1.065         stated as the target
  #   Dial-In Ep2 baseline               40g / ~29s   1.818      0.950         not flagged (issue was flavour/temp)
  #   Dial-In Ep2 after adjustment       ~37g / ~30s  1.609      1.043         "hit the numbers", fine
  #
  # Any expected_flow_g_s in [1.673, 1.775] separates every verdict above at
  # 0.88/1.10; 1.7 is the round number nearest the middle of that range.
  # Caveats, on top of the pre-existing ones (small, single-creator, spoken-
  # approximate-timing dataset): the assumed 7s pre-infusion is itself
  # unverified per source - Ep2's Sage/Breville dual boiler plausibly matches
  # this project's own ~7s default, but Ep1's Mythos One/Black Eagle
  # Gravitech and the Grind Size episode's generic example give no PI
  # duration at all, so this refit is one step better-grounded than a total
  # guess, not a real derivation. Due for replacement once real instrumented
  # shot history exists. Full derivation: docs/data/DIAL_IN_RULES.md Part 4.
  expected_flow_g_s: 1.7

  # Shared, stage-agnostic duration_ratio severity ladder - named tiers of
  # how far a shot's actual duration deviated from expected_s. Two things
  # read this same list: flow_analysis.py's analyze_shot derives its
  # too_fast/healthy/too_restrictive verdict from the "healthy" entry's own
  # edges alone (_healthy_duration_ratio_bounds; "healthy"'s own max, and
  # the entry right before it, are exactly the 0.88/1.10 cutoffs the
  # expected_flow_g_s derivation above was fit against) - grind_correction.py
  # (expert_rules.grind_correction.grind_deltas) uses the full ladder to
  # size a correction. This used to be two copies of the same idea (a flat
  # too_fast_factor/too_restrictive_factor pair here, and a duplicated
  # duration_ratio_max on grind_correction's own "slightly_fast"/"healthy"
  # bands) that happened to agree only because nothing forced them to -
  # single-sourcing it here means editing a boundary (or its
  # dashboard-editable grind_band_*_max counterpart) now genuinely changes
  # both Stage 1 classification and grind-correction banding together,
  # not just one silently-diverging copy of it. duration_ratio_max: null
  # on the last entry is the unbounded catch-all (grossly_restrictive).
  duration_ratio_bands:
    - name: grossly_fast  # anything under 0.60 is grossly_fast
      duration_ratio_max: 0.60
    - name: moderately_fast  # 0.6 < moderately_fast < 0.75
      duration_ratio_max: 0.75
    - name: slightly_fast  # 0.75 < slightly_fast < 0.88
      duration_ratio_max: 0.88
    - name: healthy  # 0.88 < healthy < 1.10
      duration_ratio_max: 1.10
    - name: slightly_restrictive  # 1.10 < slightly_restrictive < 1.30
      duration_ratio_max: 1.30
    - name: moderately_restrictive  # 1.30 < moderately_restrictive < 1.60
      duration_ratio_max: 1.60
    - name: grossly_restrictive  # anything above 1.60 is grossly_restrictive
      duration_ratio_max: null

# =============================================================================
# stop_latency_calibration - runtime_shot.py's online-learning calibration
# for stop_latency_normal_s/stop_latency_elevated_s (defaults.controller):
# hardware-timing constants behind the predictive stop, not a video-sourced
# policy (that's expert_rules below) - grouped with flow_analysis_constants
# in spirit.
#
# stop_latency_*_s (BLE press + pump stop + drip settle, times live flow =
# the adaptive stop margin) are learned, not fixed - see
# _update_learned_stop_latency. Split into two buckets by flow rate at the
# stop decision rather than one shared average - not because BLE/pump-stop
# hardware itself responds slower at high flow (there's no physical reason
# it would), but because _observed_stop_latency backs out "latency" by
# assuming flow held constant at flow_at_decision for the whole window, and
# shots in the elevated regime tend to still be speeding up (channeling)
# through that window - that constant-flow assumption undercounts their
# true tail grams, so the fitted "latency" inflates to compensate. 
# A shot's own flow at decision time predicts its needed latency
# almost perfectly in practice (0.97 correlation across 5 real shots), so a
# fast shot isn't an outlier to exclude, just a point needing a bigger
# estimate - one shared average risked dragging the estimate past where
# early_stop_margin_min_g's floor still protects a normal shot. Seed values
# (defaults.controller, 3.2s/4.3s) are the average observed latency on each
# side of bucket_cutoff_g_s.
#
# normal's seed was 3.4s until too_fast_but_flagged_invalid_adapt_pi (a real
# fixture, tests/fixtures/real_shots/) showed a genuine 3.5g/9% undershoot
# (37.5g target, 34.0g actual): at this shot's own flow_at_decision (2.81
# g/s, near the top of the normal range), the 3.4s seed projected a 9.55g
# margin, but only 6.1g of tail actually landed - an observed latency of
# just 2.17s. Averaged across all 4 real normal-bucket shots now on file
# (flow 0.97-2.81 g/s), that pulls the mean from 3.39s down to 3.17s
# (rounded to 3.2s here) - see
# tests/test_constant_drift.py's StopLatencyBucketDriftReport for the full
# per-shot numbers. Within that same 4-shot set, observed latency actually
# fell as flow rose (0.97 g/s -> 3.72s, 2.02 -> 3.57s, 2.37 -> 3.21s,
# 2.81 -> 2.17s) - the opposite of the positive flow/latency relationship
# the two-bucket split above is premised on - but 4 points (one of them
# sitting right next to a real end-of-shot scale disturbance that makes its
# own final-weight reading less certain) isn't enough to conclude the
# normal bucket needs its own flow-dependent model, only enough to nudge
# its one shared average. Revisit again as more real shots accumulate,
# per this section's own opening comment.
# =============================================================================
stop_latency_calibration:
  learning_rate: 0.15

  # Bounds on either learned latency, so one anomalous shot can only nudge
  # its bucket's estimate, never send it somewhere absurd in one step.
  min_s: 0.5
  max_s: 8.0

  # Flow-rate split between the "normal"/"elevated" latency buckets - falls
  # in the real gap between our normal (~2.0-2.4 g/s) and elevated
  # (~3.6-5.1 g/s) shots; revisit as more real shots accumulate.
  bucket_cutoff_g_s: 3.0

  # Flow at the stop decision must clear this floor for the observed
  # latency ((final_weight - weight_at_decision) / flow) to be numerically
  # meaningful rather than noise from a near-zero denominator.
  min_flow_for_learning_g_s: 0.5

  # How much longer than the larger learned latency to keep recording after
  # a stop/abort press before finalizing - needs headroom above both, or
  # the very shots used to learn them get their own tail cut short.
  settle_buffer_s: 2.0
  min_settle_s: 4.0

# =============================================================================
# expert_rules - correction policy consolidated from James Hoffmann's, Lance
# Hedrick's, and Matt Perger's dial-in videos (DESIGN.md §13-15): which
# lever to pull, in what order, by how much - as data, not code. The
# diagnostic math producing a shot's classification/duration_ratio stays in
# flow_analysis.py.
#
# Full per-source quotes: docs/DIAL_IN_RULES.md (Hoffmann) and
# docs/CROSS_CREATOR_RULE_CHECK.md (cross-checked against Lance
# Hedrick/Matt Perger).
# =============================================================================
expert_rules:

  # --- Phase 4, live: grind_correction ----------------------------------------
  # Corrects a shot's flow-rate deviation by moving grind only, holding
  # every other recipe variable constant (DESIGN.md §13 Stage 2). Never
  # applied to puck_prep_issue/invalid_measurement: flow_analysis.py can't
  # yet tell bad puck prep from grind-too-fine from the weight curve alone,
  # so "repeat, don't touch grind" is the safe default - overridden once a
  # puck_prep_issue streak crosses puck_prep_issue_streak_threshold below.
  grind_correction:
    applies_to_classification: [too_fast, too_restrictive]
    excludes_classification: [puck_prep_issue, invalid_measurement]
    hold_constant: [dose_g, target_yield_g, temperature_offset_c, preinfusion_s]

    # duration_ratio = actual/expected shot duration. Below 1.0 = fast;
    # above = slow/restrictive. The band boundaries themselves
    # (flow_analysis_constants.duration_ratio_bands, shared with Stage 1's
    # own classification - see that key's own comment) aren't redefined
    # here; this is just each named tier's own DF54 correction.
    # grossly_fast/moderately_fast/slightly_fast/slightly_restrictive/
    # moderately_restrictive's finer tiers are placeholder anchors - no
    # video gives numeric ratios for "moderately" vs "grossly" off, only
    # qualitative language. Revisit once real shot history exists.
    #
    # Every grind_delta (except healthy's fixed 0.0 - recommend_grind_
    # delta's own healthy_index lookup) is a dashboard-editable number
    # entity (entities.yaml's grind_band_*_delta) - these are just the
    # seeded defaults; BaristaRuntime._grind_correction_config overrides
    # with whatever's persisted.
    grind_deltas:
      grossly_fast: -2.0
      moderately_fast: -1.0
      slightly_fast: -0.5
      healthy: 0.0
      slightly_restrictive: 0.5
      moderately_restrictive: 1.0
      grossly_restrictive: 2.0

    # ~5-10g, grinder-dependent (Grind Size ep, rule 4): a shot pulled right
    # after a grind change mixes old/new grounds until purged, so it isn't
    # a clean comparison to the pre-change baseline.
    requires_purge_before_next_comparison: true

    # A bag+recipe landing on puck_prep_issue this many shots in a row
    # (storage.consecutive_puck_prep_issue_count) is systematic, not random
    # bad technique - override "repeat, don't touch grind" with a
    # coarsening recommendation instead. Both placeholders - no video gives
    # a numeric threshold/step for this case.
    puck_prep_issue_streak_threshold: 2
    puck_prep_issue_streak_coarsen_delta: 1.0

  # --- Phase 5: flavor_correction ----------------------------------------------
  # Driven by taste-feedback push notifications sent flavor_feedback_delay_s
  # after a shot finishes. Tags match DESIGN.md §13's sensory-tag list,
  # weighted for cross-creator consensus over one creator's preference (see
  # docs/CROSS_CREATOR_RULE_CHECK.md).
  #
  # Each tag's `escalation` (lever/direction, no delta_g - falls back to
  # minimum_meaningful_step) feeds resolve_flavor_state's escalation state
  # machine (DESIGN.md's Phase 5): a tag's first/persisting report applies
  # its primary lever at full strength; the axis's other tag is either an
  # unrelated problem (different lever) or an overshoot (same lever,
  # opposite direction), corrected with a damped step; once that damped
  # step drops below minimum_meaningful_step, it escalates (if defined).
  # "balanced" resets the axis.
  flavor_correction:
    minimum_meaningful_step:
      temperature_offset_c: 1
      dose_g: 0.5
      target_yield_g: 4

    # Same list/reasoning as grind_correction.hold_constant above, applied
    # to taste attribution instead of grind: a flavor-axis recommendation's
    # "current" figure is only a clean, still-attributable comparison point
    # if none of these moved since it was tagged - not just the one field
    # that axis's own lever happens to touch. If any of them changed for
    # any reason (this axis's own recommendation applied, a different
    # axis's recommendation applied, or an unrelated manual edit),
    # every axis's recommendation resets until re-tagged, not just the
    # one whose field moved - a shot where several things changed at once
    # can't be cleanly attributed to any single one of them (runtime_
    # entities.py's _flavor_axis_state).
    hold_constant: [dose_g, target_yield_g, temperature_offset_c, preinfusion_s]

    # How much smaller each overshoot correction is than the step that
    # caused it - not sourced from any transcript (evidence says "smaller,"
    # not "half"). grind_correction's own damping uses a discrete
    # "one band-tier back" instead, since grinders aren't uniform; yield/
    # dose/temperature are universal units, so a continuous halving fits
    # here. Unvalidated placeholder, same status as the rest of this file.
    overshoot_damping_ratio: 0.5

    # How much answered-response history resolve_flavor_state replays per
    # axis - generous, since a full primary/repeat/overshoot/escalate
    # cycle can span more shots than recent_flavor_tags's own default (5).
    state_replay_limit: 20

    tags:
      sour_sharp:
        lever: yield
        direction: increase
        # Hoffmann's Ratio ep capped this at 2-3g; widened after three
        # independent cross-creator examples (Lance x2, Perger) all used
        # bigger jumps (5g, 8-10g, +10g) - a 3-source majority. No source
        # agrees on one exact number, so 4 is a project-level choice, not
        # itself sourced (same category as grind_correction's own
        # magnitudes).
        delta_g: 4

        # Escalates to temperature only once confirmed to persist across
        # shots (Brew Temperature ep) and ratio alone hasn't fixed it -
        # DESIGN.md's Example C returns yield toward its prior value first
        # if a milk drink comes out too weak, rather than stacking changes.
        escalation:
          condition: persists_after_yield_change
          lever: temperature
          direction: increase

      bitter_harsh:
        lever: yield
        direction: decrease
        # Cross-creator reorder: previously mapped straight to temperature.
        # Lance's "Quick & Easy Guide" puts yield/ratio first, temperature
        # only as a secondary aside - matches Hoffmann's general "ratio
        # before temperature" rule.
        #
        # Hoffmann's "How I Dial-In Espresso - Episode 2" reports this
        # exact signature ("a little harsh... a certain sort of
        # bitterness", ~4:00-4:13) and corrects with a yield decrease from
        # "19 to 40, 41" to "maybe more like 36 to 38" (~5:09-6:01) - a real
        # ~3-5g step, consistent with 4. Full quotes: DESIGN.md's Phase 5.
        delta_g: 4

        escalation:
          condition: persists_after_yield_change
          lever: temperature
          direction: decrease
        note: "distinguish from dirty-machine bitterness (a lingering, burned flavour) - that is not a recipe fix"
        # Corroborated in two Lance Hedrick videos: darker roasts produce
        # more fines, and fines are inherently bitter - a shot can taste
        # bitter while actually under-extracted (channeling), which doesn't
        # come with true over-extraction's wateriness/dryness.
        fines_caveat: "bitter without accompanying watery/drying mouthfeel may be under-extraction/channeling, not over-extraction - do not apply this tag's fix in that case"

      thin_weak:
        lever: dose
        direction: increase
        delta_g: 0.5
        # Sourced from DESIGN.md §13 ("good flavour but too weak -> small
        # dose increase"), corroborated independently by the Dose video's
        # own 0.5g micro-tweak figure.
        note: "a small dose increase (about 0.5g) is the standard fix for a shot that already tastes good but comes across underpowered or weak"

      dry_astringent:
        lever: yield
        direction: decrease
        # Lance's "Quick & Easy Guide" pairs watery/drying/bitter as the
        # over-extraction signature (fix: lower ratio); Perger's
        # diminishing-returns finding reaches the same place from grind -
        # two independent sources, two levers. No delta_g: falls back to
        # minimum_meaningful_step.target_yield_g.
        note: "when this tag appears alongside thin/watery mouthfeel (true over-extraction): decrease yield first. If the over-extraction is actually caused by a grind pushed too fine rather than a ratio problem, back off the grind instead - this tag alone doesn't distinguish which lever caused it, only that yield or grind should move toward less extraction"

      balanced:
        note: "all good - no action"

  # --- Phase 5/6: roast_level_ratio_prior ---------------------------------------
  # target_yield_g fallback for a brand-new bag with nothing to inherit
  # from (runtime_bag.py's async_new_bag) - blended toward this
  # installation's own accumulated ratio for the same roast_level as it
  # grows (DESIGN.md §19; shares one aggregate with expected_flow_g_s/
  # roast_level_dose_prior, not three independent lookups).
  #
  # dark/light are Lance Hedrick's stated guideline (two videos agree).
  # medium was cross-checked against Hoffmann's own dial-in result
  # (19g->36-38g, ~1:1.9-2.0) and lowered from Lance's 2.5 toward that - not
  # all the way to 2.0, which would collapse the dark/medium distinction.
  # light hasn't been re-checked the same way. Full derivation:
  # docs/CROSS_CREATOR_RULE_CHECK.md.
  #
  # A low-confidence fallback, not a validated rule - Hoffmann's own
  # "Episode 0" argues ratio depends on dose/basket/grinder/water at least
  # as much as roast level.
  roast_level_ratio_prior:
    dark: 2.0
    medium: 2.2
    light: 3.0
    # Loose starting points, not fixed targets - this installation's own
    # accumulated ratio for the roast_level should override as that pool
    # grows, same as expected_flow_g_s's own prior.

  # --- Phase 5/6: roast_level_temperature_prior ---------------------------------
  # Same scope as roast_level_ratio_prior (new bag, empty slot only) -
  # seeds temperature_offset_c instead of target_yield_g.
  #
  # Hoffmann's Temperature episode gives rough roast-level ballparks (his
  # own words: "loosely from roasters' recommendations"): dark/developed
  # 85-90C, medium 88-92C, light 90-95C (docs/DIAL_IN_RULES.md). This
  # project's target machine (Breville/Sage Barista Express BES870)
  # factory-defaults to 93C/200F, independently documented as a deliberate
  # "middle-ground for most medium roasts" - corroborating medium at
  # temperature_offset_c's existing 0 rather than an absolute-degree number
  # from a different machine.
  #
  # What the ballparks give cleanly regardless of machine is *relative*
  # spacing: dark ~2-2.5C below medium, light ~2-2.5C above. Mapped onto
  # temperature_offset_c's discrete ±2-step scale, this uses only 1 step
  # each way (not the full 2) - a conservative choice given the uncertainty
  # in that mapping. (The Barista Express's real per-step adjustment is
  # ±2F/~1.1C, not the flat 1C the -2..+2°C labels imply - close enough in
  # total range, off by a small consistent amount per step.)
  roast_level_temperature_prior:
    dark: -1
    medium: 0
    light: 1

  # --- Phase 5/6: roast_level_dose_prior ---------------------------------------
  # Same scope as roast_level_ratio_prior above - seeds dose_g, sharing one
  # aggregate with it/expected_flow_g_s (DESIGN.md §19).
  #
  # Hoffmann's Dose episode: "the darker the roast... the less work you
  # need to do to extract it... with lighter roasts go for a lower dose" -
  # explicit direction for light only, so dark/medium stay at today's flat
  # default (18.0). light's -2.0g mirrors roast_level_temperature_prior's
  # own conservative single-step magnitude. A placeholder, not a validated
  # rule.
  #
  # medium's flat 18.0 has one real data point not yet acted on: Hoffmann's
  # "How I Dial-In Espresso - Episode 2" picks 19g deliberately for a
  # medium roast ("in the middle I'm gonna start with a nineteen gram
  # dose", ~1:38-2:06) - one video's example isn't enough alone to move
  # medium off 18.0, left here for whenever this prior gets more sources to
  # check against.
  roast_level_dose_prior:
    dark: 18.0
    medium: 18.0
    light: 17.0
