# Declarative source of truth for Barista Assist user-facing controls.
# Runtime/Bluetooth/database algorithms intentionally remain in Python.
version: 1

slots:
  - normal
  - decaf

defaults:
  recipe:
    dose_g: 18.0
    grind: 15.0
    target_yield_g: 36.0
    temperature_offset_c: 0
    preinfusion_s: 7
  controller:
    early_stop_margin_min_g: 1.5
    early_stop_margin_max_g: 20.0
    safety_margin_s: 3
    machine_max_shot_s: 50
    machine_pi_s: 8.0
    adapt_pi: true
    stop_latency_normal_s: 3.4
    stop_latency_elevated_s: 4.3
  new_bag:
    starting_mass_g: 250.0

entities:
  sensor:
    status:
      source: runtime
      field: status
      translation_key: status
      token: __STATUS__
      attributes: [scale_connected, selected_slot, early_stop_margin_min_g, early_stop_margin_max_g, shot_plot]

    stop_latency_normal:
      source: controller
      field: stop_latency_normal_s
      translation_key: stop_latency_normal
      token: __STOP_LATENCY_NORMAL__
      unit: s
      precision: 2

    stop_latency_elevated:
      source: controller
      field: stop_latency_elevated_s
      translation_key: stop_latency_elevated
      token: __STOP_LATENCY_ELEVATED__
      unit: s
      precision: 2

    scale_weight:
      source: scale
      field: weight_g
      translation_key: scale_weight
      unit: g
      device_class: weight
      state_class: measurement
      precision: 1
      requires_scale: true

    scale_battery:
      source: scale
      field: battery_percent
      translation_key: scale_battery
      token: __SCALE_BATTERY__
      unit: "%"
      device_class: battery
      state_class: measurement
      requires_scale: true

    active_bag:
      source: bag
      field: coffee_name
      translation_key: active_bag
      token: __ACTIVE_BAG__
      attributes:
        - slot
        - bag_id
        - roaster
        - roast_date
        - opened_at
        - dose_g
        - grind
        - target_yield_g
        - temperature_offset_c
        - preinfusion_s
        - remaining_g

    last_yield:
      source: last_shot
      field: actual_yield_g
      translation_key: last_yield
      token: __LAST_YIELD__
      unit: g
      device_class: weight
      precision: 1

    shot_classification:
      source: last_shot
      field: classification
      translation_key: shot_classification
      token: __SHOT_CLASSIFICATION__

    shot_channeling_suspicion:
      source: last_shot
      field: channeling_suspicion
      translation_key: shot_channeling_suspicion
      token: __SHOT_CHANNELING_SUSPICION__
      state_class: measurement
      precision: 2

    flow_rate:
      source: scale
      field: flow_g_s
      translation_key: flow_rate
      unit: g/s
      state_class: measurement
      precision: 2
      requires_scale: true

    beans_remaining:
      source: bag
      field: remaining_g
      translation_key: beans_remaining
      token: __BEANS_REMAINING__
      unit: g
      device_class: weight
      precision: 0
      requires_bag: true

  number:
    dose:
      source: bag
      field: dose_g
      translation_key: dose
      token: __DOSE__
      min: 15.0
      max: 22.0
      step: 0.1
      unit: g
      mode: box
      requires_bag: true

    grind:
      source: bag
      field: grind
      translation_key: grind
      token: __GRIND__
      min: 0.0
      max: 100.0
      step: 0.5
      mode: box
      requires_bag: true

    target_yield:
      source: bag
      field: target_yield_g
      translation_key: target_yield
      token: __TARGET_YIELD__
      min: 15.0
      max: 80.0
      step: 0.5
      unit: g
      mode: box
      requires_bag: true

    preinfusion:
      source: bag
      field: preinfusion_s
      translation_key: preinfusion
      token: __PREINFUSION__
      min: 1
      max: 20
      step: 1
      unit: s
      mode: box
      requires_bag: true

    early_stop_margin_min:
      source: controller
      field: early_stop_margin_min_g
      translation_key: early_stop_margin_min
      token: __EARLY_STOP_MARGIN_MIN__
      min: 0.0
      max: 15.0
      step: 0.1
      unit: g
      mode: box

    early_stop_margin_max:
      source: controller
      field: early_stop_margin_max_g
      translation_key: early_stop_margin_max
      token: __EARLY_STOP_MARGIN_MAX__
      min: 2.0
      max: 60.0
      step: 0.5
      unit: g
      mode: box

    machine_max_shot_seconds:
      source: controller
      field: machine_max_shot_s
      translation_key: machine_max_shot_seconds
      token: __MACHINE_MAX_SHOT_SECONDS__
      min: 20
      max: 120
      step: 1
      unit: s
      mode: box

    safety_margin_seconds:
      source: controller
      field: safety_margin_s
      translation_key: safety_margin_seconds
      token: __SAFETY_MARGIN_SECONDS__
      min: 1
      max: 10
      step: 0.5
      unit: s
      mode: box

    machine_pi_seconds:
      source: controller
      field: machine_pi_s
      translation_key: machine_pi_seconds
      token: __MACHINE_PI_SECONDS__
      min: 1
      max: 20
      step: 0.5
      unit: s
      mode: box

    new_bag_starting_mass:
      source: draft
      field: starting_mass_g
      translation_key: new_bag_starting_mass
      token: __NEW_BAG_STARTING_MASS__
      min: 50.0
      max: 2000.0
      step: 10.0
      unit: g
      mode: box

  select:
    bean_slot:
      source: controller
      field: selected_slot
      translation_key: bean_slot
      token: __BEAN_SLOT__
      options:
        - label: Normal
          value: normal
        - label: Decaf
          value: decaf

    temperature_offset:
      source: bag
      field: temperature_offset_c
      translation_key: temperature_offset
      token: __TEMPERATURE__
      requires_bag: true
      options:
        - label: "-2 °C"
          value: -2
        - label: "-1 °C"
          value: -1
        - label: "0 °C"
          value: 0
        - label: "+1 °C"
          value: 1
        - label: "+2 °C"
          value: 2

  switch:
    adapt_pi:
      source: controller
      field: adapt_pi
      translation_key: adapt_pi
      token: __ADAPT_PI__

  text:
    new_bag_coffee:
      source: draft
      field: coffee
      translation_key: new_bag_coffee
      token: __NEW_BAG_COFFEE__
      min: 0
      max: 120
      mode: text

    new_bag_roaster:
      source: draft
      field: roaster
      translation_key: new_bag_roaster
      token: __NEW_BAG_ROASTER__
      min: 0
      max: 120
      mode: text

  date:
    new_bag_roast_date:
      source: draft
      field: roast_date
      translation_key: new_bag_roast_date
      token: __NEW_BAG_ROAST_DATE__

  button:
    brew:
      action: brew
      translation_key: brew
      token: __BREW__
      requires_bag: true
      requires_scale: true
      requires_no_active_shot: true

    abort:
      action: abort
      translation_key: abort
      token: __ABORT__
      requires_active_shot: true
      requires_scale: true

    tare:
      action: tare
      translation_key: tare
      token: __TARE__
      requires_scale: true

    create_bag:
      action: create_bag
      translation_key: create_bag
      token: __CREATE_BAG__
