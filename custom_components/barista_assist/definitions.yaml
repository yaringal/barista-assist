# Declarative source of truth for Barista Assist user-facing controls.
# Runtime/Bluetooth/database algorithms intentionally remain in Python.
version: 1

slots:
  - normal
  - decaf

defaults:
  recipe:
    dose_g: 18.0
    grind: 15.0
    target_yield_g: 36.0
    temperature_offset_c: 0
    preinfusion_s: 7
  controller:
    early_stop_margin_min_g: 1.5
    early_stop_margin_max_g: 20.0
    safety_margin_s: 3
    machine_max_shot_s: 50
    machine_pi_s: 8.0
    adapt_pi: true
    stop_latency_normal_s: 3.4
    stop_latency_elevated_s: 4.3
    # How long after a shot finishes to send the taste-feedback push
    # notifications (expert_rules.flavor_correction) - long enough for the
    # drink to actually be tasted, short enough that the shot is still fresh
    # in memory. Not dashboard-editable (unlike the settings above it): this
    # is a one-off UX tuning knob, not something that needs live recalibration.
    flavor_feedback_delay_s: 300
  new_bag:
    starting_mass_g: 250.0

# =============================================================================
# flow_analysis_constants - every tunable threshold flow_analysis.py's Stage-1
# classifier uses, in one place. runtime.py builds a flow_analysis.
# FlowAnalysisConfig from this dict on every shot (see _async_finalize).
# FlowAnalysisConfig itself has no default values and no explanatory comments
# (consts live in yaml, code is for logic) - this is the only place both the
# numbers and the reasoning behind them live at all.
#
# Grouped below to match flow_analysis.py's own section order (leading-garbage
# -> disturbance -> smoothing/first-flow -> channeling suspicion -> flow-rate
# classification), so the two files read the same way.
# =============================================================================
flow_analysis_constants:

  # --- Leading-garbage detection ---------------------------------------------

  # A leading weight reading this far below zero is scale noise before it's
  # settled/tared, not real data - weight is never meaningfully negative, at
  # any point in a shot (ordinary scale jitter near a true zero baseline
  # stays within a couple tenths of a gram either way). A live shot hit a
  # single -48g first sample (elapsed_ms=22, one reading before the scale
  # had connected/tared) that dragged the whole smoothing/derivative
  # computation with it, misclassifying an otherwise perfectly normal (if
  # too-fast) shot as invalid_measurement. This must only ever reject on the
  # negative side - a legitimately high leading *positive* reading (e.g.
  # synthetic test data, or real samples that only start once a pour is
  # already well underway) is not implausible the same way and must never
  # be discarded.
  leading_garbage_threshold_g: 2.0

  # A leading sample whose scale_ms (the BOOKOO scale's own onboard clock)
  # runs this many ms ahead of our own elapsed_ms is a stale BLE
  # notification queued from before our tare-and-start-timer command reset
  # the scale's clock, not real data for this shot - a live shot's first two
  # samples read scale_ms=19200 while elapsed_ms was still under 200,
  # carrying a stale, unrelated 12g reading left over from whatever the
  # scale was doing before this shot. Once the scale's own clock is reset,
  # its readings drop back to roughly tracking elapsed_ms, so this only
  # ever rejects genuinely stale leading samples, not real ones.
  stale_scale_clock_threshold_ms: 2000

  # --- Mid-shot disturbance detection (cup/scale bumped, lifted, moved) ------

  # A raw weight reading this many grams below its own running peak so far
  # is treated as the cup or scale having been disturbed, not real flow:
  # weight can only rise while coffee is actually being collected, so any
  # meaningful drop - however it happens, whenever it happens - means
  # everything from that point on isn't trustworthy. Everything before it
  # still is.
  max_plausible_weight_drop_g: 0.5

  # Disturbance detection only arms once the running peak has cleared this
  # floor. Below it - typically pre-infusion, before any real coffee mass
  # has accumulated - scale settling noise alone can span several tenths of
  # a gram, comfortably exceeding max_plausible_weight_drop_g on its own
  # with no real disturbance involved; a real shot found this live,
  # misclassifying a genuine ~50g pour as invalid because of a sub-gram dip
  # minutes before the real pour even began. Once a shot has genuinely
  # accumulated this much weight, the same max_plausible_weight_drop_g drop
  # is unambiguous interference, exactly as before.
  disturbance_detection_floor_g: 2.0

  # A drop past max_plausible_weight_drop_g must hold for at least this long
  # to count as a genuine disturbance rather than a splash/settle bounce - a
  # real shot with a violent, turbulent gush saw repeated multi-gram dips
  # (droplets, crema settling, the cup rocking on the scale) that each
  # recovered and kept climbing within a few hundred ms, but the first one
  # hit the old instantaneous check and truncated the shot down to its
  # first ~9s, hiding the huge overshoot that followed and turning an
  # obviously too-fast shot into a false too_restrictive (t90 never reached
  # in the truncated data). A genuine cup-lift stays low far longer than
  # this.
  disturbance_sustain_ms: 1000

  # --- Smoothing & first-flow detection --------------------------------------

  # Fewer than this many samples can't be classified at all - not enough
  # points to smooth/derive a trend from. Arbitrary, not tuned against any
  # specific incident.
  min_samples: 5

  # Centered moving-average window applied to raw weight before computing
  # flow (the derivative) - trades detail for noise rejection. Arbitrary,
  # not tuned against any specific incident.
  smoothing_window_ms: 500

  # The derivative must clear this many g/s to count as real flow at all,
  # as opposed to scale noise around zero. Arbitrary, not tuned against any
  # specific incident.
  first_flow_threshold_g_s: 0.3

  # A single sample's derivative can spike past first_flow_threshold_g_s
  # purely from scale quantization (e.g. a 0.1g-resolution reading landing
  # right at a sample boundary) even during a genuine low/no-flow trickle -
  # real flow stays above the threshold for a run of samples, not just one,
  # so "first flow" requires the crossing to hold for at least this long.
  first_flow_sustain_ms: 300

  # A shot's first detected flow earlier than this fraction of its
  # configured pre-infusion duration is implausible - pre-infusion is meant
  # to be a low/no-flow soak. Unvalidated placeholder, same status as the
  # rest of this group.
  early_flow_fraction_of_preinfusion: 0.5

  # --- Channeling suspicion ---------------------------------------------------
  # Getting these three better calibrated needs more real recorded edge
  # cases for a human to review, not just more shot volume - there's no
  # automatic ground truth for "was this really channeling" the way there
  # is for e.g. stop_latency's tail-weight error, and none of the 16
  # James Hoffmann/Lance Hedrick/Matt Perger dial-in videos this project
  # has cross-checked describe channeling numerically (only qualitatively -
  # "a sudden rise in flow", "tiger striping"). All three remain unvalidated
  # guesses.

  # A bag needs at least this many recorded healthy shots before its own
  # baseline (median late-shot acceleration) is trusted for the
  # baseline-deviation channeling check - too few, and one atypical healthy
  # shot could dominate the "normal for this bag" reference point.
  min_baseline_shots: 3

  # channeling_suspicion at or above this value classifies puck_prep_issue
  # rather than by the shot's hydraulic fast/slow reading (docs/DESIGN.md
  # section 13 Stage 1).
  suspicion_threshold: 0.6

  # Fixed prior: mid- or late-shot flow accelerating upward by this many g/s
  # per second is treated as maximally suspicious, independent of any
  # baseline.
  absolute_accel_limit_g_s2: 1.0

  # --- Flow-rate classification (the Hoffmann-calibrated trio) ---------------

  # How many "pseudo-shots" the expected_flow_g_s prior below is worth when
  # blending with a bag's own healthy-shot history - shrinks toward the
  # bag-specific median as shot_count grows. Unvalidated placeholder.
  prior_weight_shots: 1.0

  # expected_flow_g_s: the flow rate (target_yield_g / total shot seconds,
  # t90-ish) a "normal" shot is expected to run at, before any per-bag
  # history exists (flow_analysis blends this with the bag's own recent
  # median as shots accumulate - see flow_analysis._blended_expected_flow_g_s,
  # unaffected by this change). too_fast_factor/too_restrictive_factor
  # bound how far duration_s may deviate from expected_s (=
  # target_yield_g / expected_flow_g_s) before a shot leaves "healthy":
  # too_fast if duration_s < expected_s * too_fast_factor, too_restrictive
  # if duration_s > expected_s * too_restrictive_factor.
  #
  # Unlike every other constant in this file, these three have a real
  # derivation: checked directly against every dose/yield/time data point
  # across James Hoffmann's dial-in videos that he gave an explicit
  # good/bad verdict on - converted to flow_g_s = yield_g / time_s, then to
  # duration_ratio = expected_flow_g_s / actual_flow_g_s:
  #
  #   source                          yield/time      flow_g_s  duration_ratio  verdict
  #   Dial-In Ep1 shot 1              40g / 34s        1.176      1.105         "too slow" (harsh/muddy/sour)
  #   Dial-In Ep1 shot 2              38g / 25s        1.520      0.855         "too fast" (under-extracted)
  #   Dial-In Ep1 shot 3              38g / 27s        1.407      0.924         improving, not flagged as fast/slow
  #   Dial-In Ep1 shot 4 ("pretty good") 38.5g / 29s    1.328      0.979         accepted
  #   Grind Size ep's own "good" example 36g / 30s      1.200      1.083         stated as the target to hit
  #   Dial-In Ep2 baseline             40g / ~29s       1.379      0.943         not flagged as fast/slow (issue was flavour/temp)
  #   Dial-In Ep2 after adjustment     ~37g / ~30s      1.233      1.054         "hit the numbers", fine
  #
  # (expected_flow_g_s = 1.3 used to compute duration_ratio above.) The
  # bad-verdict points (1.105, 0.855) and every accepted/unflagged point
  # (0.924-1.083) separate cleanly at roughly 0.88 and 1.10. This is still a
  # small (7-point), spoken-approximate-timing dataset from one creator's
  # equipment, not this installation's own instrumented shot history - a
  # better-grounded starting point than an invented example, but still to
  # be replaced once Phase 3b/4b's real recorded shots exist. Full
  # derivation/history: docs/DIAL_IN_RULES.md Part 4.
  expected_flow_g_s: 1.3
  too_fast_factor: 0.88
  too_restrictive_factor: 1.10

# =============================================================================
# expert_rules - correction rules consolidated from James Hoffmann's,
# Lance Hedrick's, and Matt Perger's dial-in videos (DESIGN.md §13-15). This
# encodes *policy* (which lever to pull, in what order, by how much) as data;
# the diagnostic math that produces a shot's classification/duration_ratio
# stays in flow_analysis.py (see flow_analysis_constants above for that).
#
# Full per-source quotes and reasoning for everything in this section:
# docs/DIAL_IN_RULES.md (James Hoffmann) and docs/CROSS_CREATOR_RULE_CHECK.md
# (cross-checked against Lance Hedrick/Matt Perger, including what was
# deliberately left out as one creator's personal preference rather than a
# genuine consensus/mechanism - see that doc's "queued decisions").
# =============================================================================
expert_rules:

  # --- Phase 4, live: grind_correction ----------------------------------------
  # Corrects a shot's flow-rate deviation by moving grind only, holding every
  # other recipe variable constant (DESIGN.md §13 Stage 2 - "isolate
  # variables"). Never applied to a puck_prep_issue or invalid_measurement
  # shot: channeling has two distinct causes (bad puck prep vs. grind ground
  # too fine for the pressure/prep quality being used) and flow_analysis.py
  # can't yet tell them apart from the weight curve alone, so defaulting to
  # "repeat the recipe, don't touch grind" is the safe choice until it can.
  #
  # TODO, queued: that "repeat, don't touch grind" default is applied the
  # same way no matter how many consecutive shots at this recipe have come
  # back puck_prep_issue - nothing tracks the streak or reconsiders the
  # exclusion once it's happened repeatedly, even though a recurring result
  # is evidence against "one-off bad tamp" and toward "grind genuinely too
  # fine for this recipe" (see flow_analysis.py's classification TODO and
  # docs/DESIGN.md §12).
  grind_correction:
    applies_to_classification: [too_fast, too_restrictive]
    excludes_classification: [puck_prep_issue, invalid_measurement]
    hold_constant: [dose_g, target_yield_g, temperature_offset_c, preinfusion_s]

    # duration_ratio = actual shot duration / expected duration for this bag,
    # using flow_analysis_constants.expected_flow_g_s above. Below 1.0 = ran
    # fast; above 1.0 = ran slow/restrictive. Bands are ordered ascending by
    # duration_ratio_max; a shot's duration_ratio picks the first band whose
    # max it is <= to (grossly_restrictive, with no max, catches anything
    # above moderately_restrictive's). The healthy band's own edges
    # (0.88/1.10) are the video-sourced values derived above; the finer
    # slightly/moderately/grossly tiers beyond that boundary are still
    # placeholder anchors, not derived data - none of the videos give
    # numeric ratios for "moderately" vs "grossly" off, only qualitative
    # language ("way too fast" vs "a little bit finer"). Revisit alongside
    # Phase 3b/4b once real shot history exists to calibrate them.
    bands:
      - name: grossly_fast
        duration_ratio_max: 0.6
        grind_delta: -2.0
      - name: moderately_fast
        duration_ratio_max: 0.75
        grind_delta: -1.0
      - name: slightly_fast
        duration_ratio_max: 0.88
        grind_delta: -0.5
      - name: healthy
        duration_ratio_max: 1.10
        grind_delta: 0.0
      - name: slightly_restrictive
        duration_ratio_max: 1.30
        grind_delta: 0.5
      - name: moderately_restrictive
        duration_ratio_max: 1.60
        grind_delta: 1.0
      - name: grossly_restrictive
        duration_ratio_max: null
        grind_delta: 2.0

    # ~5-10g, grinder-dependent (Grind Size ep, rule 4): a shot pulled right
    # after a grind change is a mix of old- and new-setting grounds until
    # purged, so it isn't a clean comparison to the pre-change baseline.
    requires_purge_before_next_comparison: true

  # --- Phase 5: flavor_correction ----------------------------------------------
  # Consumed by flavor_correction.py, driven by taste-feedback push
  # notifications sent flavor_feedback_delay_s after a shot finishes (see
  # runtime.py's _async_send_flavor_feedback_notifications). Tags match
  # DESIGN.md §13's own sensory-tag list. Weighted for genuine
  # consensus/mechanism over any one creator's personal preference - see
  # docs/CROSS_CREATOR_RULE_CHECK.md.
  #
  # TODO(revisit once real, verified shot data exists): every tag's
  # `escalation` block below is not yet implemented - flavor_correction.py
  # only ever recommends a tag's own base lever/delta, never escalates to a
  # second lever after a first correction is tried and the tag still
  # persists. See flavor_correction.py's own module docstring for why this
  # was deferred rather than built now.
  flavor_correction:
    lever_order: [yield, temperature, dose, preinfusion]

    # A single shot's taste tag shouldn't trigger a correction on its own
    # (Brew Temperature ep: "time and time and time again", not one shot -
    # shot-to-shot variation and bean heterogeneity can produce a false
    # signal). Applies to flavour tags; flow-classification-driven grind
    # corrections above are exempt since duration_ratio is measured directly,
    # not self-reported.
    require_persistent_pattern_shots: 2
    minimum_meaningful_step:
      temperature_offset_c: 1
      dose_g: 0.5
      target_yield_g: 2.5

    tags:
      sour_sharp:
        lever: yield
        direction: increase
        # Hoffmann's Ratio ep capped this at 2-3g; widened after three
        # independent cross-creator examples (Lance x2, Perger) all used
        # bigger jumps - 5g, 8-10g, +10g - a 3-source majority, not "trust
        # Lance over Hoffmann". None of the sources agree on one exact
        # number though, so 5 (this spread's own low end) is a project-level
        # implementation choice, not itself sourced from any one video -
        # same category as Phase 4's grind_correction magnitudes (see
        # docs/DESIGN.md's Phase 4 section). Picked once here, in data,
        # rather than recomputed from a stored range every time
        # flavor_correction.py reads this tag.
        delta_g: 5
        # Escalates to temperature only once the issue is
        # confirmed to persist across shots (Brew Temperature ep) and ratio
        # alone hasn't fixed it - if a milk drink comes out too weak as a
        # result, DESIGN.md's Example C says to return yield toward its
        # prior value before trying +1°C, rather than stacking both changes.
        escalation:
          condition: persists_after_yield_change
          lever: temperature
          direction: increase

      bitter_harsh:
        lever: yield
        direction: decrease
        # Cross-creator reorder: previously mapped straight to temperature.
        # Lance's "Quick & Easy Guide" puts yield/ratio decrease first,
        # temperature only as a secondary aside for machines that support
        # it - matches Hoffmann's own general "ratio before temperature"
        # rule, so this was fixing an internal inconsistency, not adopting
        # a new claim. No delta_g: no source gives a magnitude for this
        # direction, only "lower it" - falls back to this block's own
        # minimum_meaningful_step.target_yield_g instead of a guessed figure.
        escalation:
          condition: persists_after_yield_change
          lever: temperature
          direction: decrease
        note: "distinguish from dirty-machine bitterness (a lingering, burned flavour) - that is not a recipe fix"
        # Corroborated independently in two Lance Hedrick videos: darker
        # roasts produce more fines, and fines are inherently bitter, so a
        # shot can taste bitter while actually being UNDER-extracted (via
        # channeling) - true over-extraction bitterness comes together with
        # wateriness/dryness, fines-driven bitterness doesn't necessarily.
        fines_caveat: "bitter without accompanying watery/drying mouthfeel may be under-extraction/channeling, not over-extraction - do not apply this tag's fix in that case"

      thin_weak:
        lever: dose
        direction: increase
        delta_g: 0.5
        # Sourced from DESIGN.md §13 ("good flavour but too weak -> small
        # dose increase"), corroborated independently by the Dose video's
        # own 0.5g micro-tweak figure.
        note: "a small dose increase (about 0.5g) is the standard fix for a shot that already tastes good but comes across underpowered or weak"

      dry_astringent:
        lever: yield
        direction: decrease
        # Previously unmapped for lack of evidence. Now grounded: Lance's
        # "Quick & Easy Guide" pairs watery/drying/bitter together as the
        # over-extraction signature (fix: lower ratio); Matt Perger's
        # independent diminishing-returns finding arrives at the same place
        # from grind (pushing it past its peak makes mouthfeel "dry" while
        # extraction and strength both drop) - two different levers, same
        # diagnosis, from two independent sources. No delta_g, same reason
        # as bitter_harsh: falls back to minimum_meaningful_step.target_yield_g.
        note: "when this tag appears alongside thin/watery mouthfeel (true over-extraction): decrease yield first. If the over-extraction is actually caused by a grind pushed too fine rather than a ratio problem, back off the grind instead - this tag alone doesn't distinguish which lever caused it, only that yield or grind should move toward less extraction"

      balanced:
        note: "all good - no action"

  # --- Phase 5/6: roast_level_ratio_prior ---------------------------------------
  # Consumed by runtime.py's async_new_bag as a target_yield_g fallback -
  # only when a brand-new bag is opened in a slot with no existing bag to
  # inherit a recipe from (there is still no "similar coffee" warm-start
  # match to prefer over this; DESIGN.md §19's own warm-start logic remains
  # unimplemented, so this prior is used whenever roast_level is known and
  # there's nothing else at all to seed from).
  #
  # dark/light are Lance Hedrick's stated guideline (two videos agree
  # closely). medium was cross-checked against Hoffmann's own actual
  # medium-roast dial-in result (19g->36-38g, "the classic two to one
  # ratio", ~1:1.9-2.0) and lowered from Lance's 2.5 toward that - not all
  # the way to 2.0, which would collapse the dark/medium distinction this
  # prior exists to encode. light hasn't been re-checked the same way (only
  # one weaker Hoffmann data point exists for it). Full derivation:
  # docs/CROSS_CREATOR_RULE_CHECK.md.
  #
  # Worth weighing this whole prior lightly regardless of the exact numbers:
  # Hoffmann's own "Episode 0" argues at length against exactly this kind of
  # simplification - ratio depends on dose, basket, grinder, and water at
  # least as much as roast level. This is a low-confidence fallback for when
  # nothing else is available, not a validated rule.
  roast_level_ratio_prior:
    dark: 2.0
    medium: 2.2
    light: 3.0
    # Both Lance sources are explicit these are loose starting points, not
    # fixed targets - use only to seed target_yield_g for a brand-new bag; a
    # bag's own accepted shots should override this immediately, the same
    # way flow_analysis_constants' expected_flow_g_s prior yields to a bag's
    # own history.

entities:
  sensor:
    status:
      source: runtime
      field: status
      translation_key: status
      token: __STATUS__
      attributes: [scale_connected, selected_slot, early_stop_margin_min_g, early_stop_margin_max_g, shot_plot]

    stop_latency_normal:
      source: controller
      field: stop_latency_normal_s
      translation_key: stop_latency_normal
      token: __STOP_LATENCY_NORMAL__
      unit: s
      precision: 2

    stop_latency_elevated:
      source: controller
      field: stop_latency_elevated_s
      translation_key: stop_latency_elevated
      token: __STOP_LATENCY_ELEVATED__
      unit: s
      precision: 2

    scale_weight:
      source: scale
      field: weight_g
      translation_key: scale_weight
      unit: g
      device_class: weight
      state_class: measurement
      precision: 1
      requires_scale: true

    scale_battery:
      source: scale
      field: battery_percent
      translation_key: scale_battery
      token: __SCALE_BATTERY__
      unit: "%"
      device_class: battery
      state_class: measurement
      requires_scale: true

    active_bag:
      source: bag
      field: coffee_name
      translation_key: active_bag
      token: __ACTIVE_BAG__
      attributes:
        - slot
        - bag_id
        - roaster
        - roast_date
        - roast_level
        - opened_at
        - dose_g
        - grind
        - target_yield_g
        - temperature_offset_c
        - preinfusion_s
        - remaining_g

    last_yield:
      source: last_shot
      field: actual_yield_g
      translation_key: last_yield
      token: __LAST_YIELD__
      unit: g
      device_class: weight
      precision: 1

    shot_classification:
      source: last_shot
      field: classification
      translation_key: shot_classification
      token: __SHOT_CLASSIFICATION__

    shot_channeling_suspicion:
      source: last_shot
      field: channeling_suspicion
      translation_key: shot_channeling_suspicion
      token: __SHOT_CHANNELING_SUSPICION__
      state_class: measurement
      precision: 2

    recommended_grind:
      # Phase 4 (docs/DESIGN.md section 28) - a human-readable "current
      # setting -> recommended setting" note (e.g. "15.0 -> 14.0"), computed
      # in BaristaRuntime.entity_value from the last shot's own recorded
      # grind setting (shots.grind - the value that shot actually ran at,
      # not whatever the bag's live grind happens to be now if it's since
      # been changed for an unrelated reason) plus grind_correction.py's
      # recommend_grind_delta() output (persisted as shots.
      # recommended_grind_delta - see storage.finalize_shot). None/
      # unavailable when the last shot wasn't a grind-correction candidate
      # (healthy, or excluded as puck_prep_issue/invalid_measurement) -
      # that's a real "no recommendation" state, not a fault. field is a
      # virtual name (not a real shots column) that entity_value
      # special-cases, the same way source: bag's remaining_g does.
      source: last_shot
      field: recommended_grind_note
      translation_key: recommended_grind
      token: __RECOMMENDED_GRIND__

    recommended_flavor:
      # Phase 5 (docs/DESIGN.md section 13) - a human-readable "current
      # setting -> recommended setting" note per axis (e.g. "Target yield:
      # 36.0 -> 41.0 (persistent sour_sharp)"), computed in
      # BaristaRuntime.entity_value from the selected bag's own recent,
      # answered taste-feedback tags (storage.recent_flavor_tags) plus
      # flavor_correction.py's recommend_flavor_correction() output. Both
      # axes (extraction, mouthfeel) are checked independently and joined
      # with "; " when both currently have a recommendation. None/
      # unavailable when neither axis has a persistent pattern yet - that's
      # a real "no recommendation" state, not a fault. field is a virtual
      # name (not a real bag column) that entity_value special-cases, the
      # same way source: bag's remaining_g/recommended_grind_note do.
      source: bag
      field: recommended_flavor_note
      translation_key: recommended_flavor
      token: __RECOMMENDED_FLAVOR__
      requires_bag: true

    flow_rate:
      source: scale
      field: flow_g_s
      translation_key: flow_rate
      unit: g/s
      state_class: measurement
      precision: 2
      requires_scale: true

    beans_remaining:
      source: bag
      field: remaining_g
      translation_key: beans_remaining
      token: __BEANS_REMAINING__
      unit: g
      device_class: weight
      precision: 0
      requires_bag: true

  number:
    dose:
      source: bag
      field: dose_g
      translation_key: dose
      token: __DOSE__
      min: 15.0
      max: 22.0
      step: 0.5
      unit: g
      mode: box
      requires_bag: true
      # "recommended" (e.g. "18.0 -> 18.5") is a virtual attribute
      # (BaristaRuntime.entity_attributes special-cases it, the same way
      # source: bag's remaining_g/bag_id do) - flavor_correction's
      # persistent-pattern recommendation for this field, if any. Shown as
      # a decoration on this same tile via dashboard.yaml's
      # state_content: [state, recommended], not a separate card.
      attributes: [recommended]

    grind:
      source: bag
      field: grind
      translation_key: grind
      token: __GRIND__
      min: 0.0
      max: 100.0
      step: 0.5
      mode: box
      requires_bag: true
      # Phase 4's grind_correction recommendation for the last shot (docs/
      # DESIGN.md section 28) - see dose's own "recommended" comment above
      # for the general mechanism; this one comes from the last completed
      # shot rather than flavor_correction's bag-level tags.
      attributes: [recommended]

    target_yield:
      source: bag
      field: target_yield_g
      translation_key: target_yield
      token: __TARGET_YIELD__
      attributes: [recommended]
      min: 15.0
      max: 80.0
      # A UI increment only (runtime._validate_recipe_field only checks
      # min/max, not step alignment - any value in range is accepted, not
      # just multiples of this) - 2.5g matches Hoffmann's original 2-3g
      # ceiling for a yield fine-tune (docs/DESIGN.md section 6.3). The
      # wider 5g figure is expert_rules.flavor_correction.tags.sour_sharp's
      # own delta_g, a separate value from this UI increment.
      step: 2.5
      unit: g
      mode: box
      requires_bag: true

