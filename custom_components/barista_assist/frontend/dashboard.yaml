title: Barista Assist
views:
  - title: Brew
    path: brew
    icon: mdi:coffee-to-go
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ready to brew
            heading_style: title
            icon: mdi:coffee-to-go

          - type: tile
            entity: __STATUS__
            name: Status
            color: green
            vertical: true

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            color: brown
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date

          - type: tile
            entity: __BEANS_REMAINING__
            name: Beans remaining
            color: brown

      - type: grid
        cards:
          - type: heading
            heading: Recipe
            heading_style: title
            icon: mdi:tune-variant

          - type: tile
            entity: __DOSE__
            name: Dose
            color: amber
            state_content: [state, recommended]
            features: &number_buttons
              - type: numeric-input
                style: buttons
            features_position: bottom

          - type: tile
            entity: __GRIND__
            name: Grind
            color: amber
            state_content: [state, recommended]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TARGET_YIELD__
            name: Target yield
            color: amber
            state_content: [state, recommended]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TEMPERATURE__
            name: Temperature offset
            color: orange
            state_content: [state, recommended]
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __PREINFUSION__
            name: Pre-infusion
            color: blue
            features: *number_buttons
            features_position: bottom
            visibility:
              - condition: state
                entity: __ADAPT_PI__
                state: "on"

      - type: grid
        cards:
          - type: heading
            heading: Live shot
            heading_style: title
            icon: mdi:chart-line

          - type: custom:barista-assist-live-shot-card
            entity: __STATUS__
            title: Weight & flow rate

          - type: heading
            heading: Controls
            heading_style: title
            icon: mdi:gesture-tap-button

          - type: entities
            show_header_toggle: false
            entities:
              - entity: __BREW__
                name: Brew
              - entity: __TARE__
                name: Tare
              - entity: __ABORT__
                name: Abort

          - type: custom:barista-assist-export-card
            title: Shot data
            button_text: Copy all shot data

      - type: grid
        cards:
          - type: heading
            heading: Last brew
            heading_style: title
            icon: mdi:history

          - type: tile
            entity: __LAST_YIELD__
            name: Last yield
            color: green

          - type: tile
            entity: __SHOT_CLASSIFICATION__
            name: Shot diagnosis
            color: brown

          - type: tile
            entity: __SHOT_CHANNELING_SUSPICION__
            name: Channeling suspicion
            color: red

          - type: entities
            title: Future shot recommendation
            show_header_toggle: false
            entities:
              - entity: __RECOMMENDED_GRIND__
                name: Grind
              - entity: __RECOMMENDED_FLAVOR__
                name: Flavor

  - title: Bags
    path: bags
    icon: mdi:sack
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New physical bag
            heading_style: title
            icon: mdi:package-variant-plus

          - type: markdown
            content: >-
              **Create or replace the selected Normal/Decaf bag.**

              A replacement bag inherits that slot's current recipe. The first bag in an
              empty slot starts at **18.0 g dose / DF54 15 / 7 s PI**, with target yield
              and temperature seeded from the roast level selected below (medium:
              **39.6 g / 0 °C**) - change "New bag roast level" to adjust.

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            features:
              - type: select-options
            features_position: bottom

          - type: entities
            title: Bag details
            show_header_toggle: false
            entities:
              - entity: __NEW_BAG_COFFEE__
                name: New bag coffee
              - entity: __NEW_BAG_ROASTER__
                name: New bag roaster
              - entity: __NEW_BAG_ROAST_DATE__
                name: New bag roast date
              - entity: __NEW_BAG_ROAST_LEVEL__
                name: New bag roast level
              - entity: __NEW_BAG_STARTING_MASS__
                name: New bag starting mass

          - type: tile
            entity: __CREATE_BAG__
            name: Create bag
            color: green
            hide_state: true
            features:
              - type: button
                action_name: Save new bag

      - type: grid
        cards:
          - type: heading
            heading: Current bag
            heading_style: title
            icon: mdi:package-variant-closed

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date
              - opened_at
              - remaining_g

          - type: entities
            title: Current recipe
            show_header_toggle: false
            entities:
              - entity: __DOSE__
                name: Dose
              - entity: __GRIND__
                name: Grind
              - entity: __TARGET_YIELD__
                name: Target yield
              - entity: __TEMPERATURE__
                name: Temperature offset
              - entity: __PREINFUSION__
                name: Adaptive Pre-infusion

  - title: System
    path: system
    icon: mdi:cog-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Barista Assist
            heading_style: title
            icon: mdi:coffee-to-go

          - type: entities
            title: Connection and control
            show_header_toggle: false
            entities:
              - entity: __STATUS__
                name: Status
              - entity: __SCALE_BATTERY__
                name: Scale battery
              - entity: __MACHINE_MAX_SHOT_SECONDS__
                name: Machine max shot duration
              - entity: __SAFETY_MARGIN_SECONDS__
                name: Stop safety margin
              - entity: __ADAPT_PI__
                name: Adapt PI
              - type: conditional
                conditions:
                  - entity: __ADAPT_PI__
                    state: "off"
                row:
                  entity: __MACHINE_PI_SECONDS__
                  name: Machine pre-infusion
              - type: section
                label: Yield Prediction
              - type: section
                label: Stop at weight = target yield - margin; margin = latency * current flow
              - entity: __EARLY_STOP_MARGIN_MIN__
                name: Minimum early stop margin
              - entity: __EARLY_STOP_MARGIN_MAX__
                name: Maximum early stop margin
              - entity: __STOP_LATENCY_NORMAL__
                name: Learned latency (normal flow ~2g/s)
              - entity: __STOP_LATENCY_ELEVATED__
                name: Learned latency (fast flow ~4g/s)
              - type: section
                label: Flavor correction
              - type: section
                label: Smallest adjustment worth making before escalating to the next lever
              - entity: __MIN_STEP_TARGET_YIELD__
                name: Minimum yield adjustment
              - entity: __MIN_STEP_DOSE__
                name: Minimum dose adjustment
              - entity: __MIN_STEP_TEMPERATURE_OFFSET__
                name: Minimum temperature adjustment

      - type: grid
        cards:
          - type: heading
            heading: Grind correction
            heading_style: title
            icon: mdi:tune-vertical

          - type: heading
            heading: Duration ratio bands to drive grind change
            heading_style: subtitle

          # These tiles read left-to-right as one ascending duration_ratio
          # ladder (each band's own max: 0.6, 0.75, 0.88...); each boundary
          # value is only ever stored/shown once, on the tile to its left.
          # The unbounded -∞/∞ ends aren't stated separately anywhere - the
          # first tile's own seconds_hint reads "(≤ Xs)" instead of a
          # range, and the trailing "Severely restrictive" markdown card
          # below reads "(≥ Xs)" for the same reason (grossly_restrictive
          # has no max entity of its own).
          #
          # Each tile's seconds_hint attribute is the same "how many
          # seconds is this" range this section originally tried to
          # template directly into name - tile cards don't support
          # templates on name/icon/color at all (an explicitly rejected HA
          # feature request: https://github.com/home-assistant/frontend/
          # discussions/19930), so it rendered as literal "{{ ... }}"
          # instead of evaluating. seconds_hint is computed for real in
          # Python instead (runtime_entities.py's _grind_band_seconds_hint,
          # off definitions.yaml's live defaults - no hardcoded reference
          # constant to go stale here) and shown via state_content, the
          # same proven mechanism the "recommended" attribute already uses
          # elsewhere on this dashboard.
          - type: tile
            entity: __GRIND_BAND_GROSSLY_FAST_MAX__
            name: Grossly fast
            color: blue
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __GRIND_BAND_MODERATELY_FAST_MAX__
            name: Moderately fast
            color: blue
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __GRIND_BAND_SLIGHTLY_FAST_MAX__
            name: Slightly fast
            color: blue
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __GRIND_BAND_HEALTHY_MAX__
            name: Healthy
            color: green
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __GRIND_BAND_SLIGHTLY_RESTRICTIVE_MAX__
            name: Slightly restrictive
            color: red
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __GRIND_BAND_MODERATELY_RESTRICTIVE_MAX__
            name: Moderately restrictive
            color: red
            state_content: [state, seconds_hint]
            features: *number_buttons
            features_position: bottom

          # grossly_restrictive has no max of its own (it's the unbounded
          # catch-all past moderately_restrictive_max - see
          # grind_correction.py's _matched_band_index), so there's no
          # editable tile for it, but the ladder still needs a label for
          # its range. Markdown card content DOES genuinely support Jinja
          # templates (unlike tile card fields), but state_attr here reads
          # the same Python-computed beyond_seconds_hint attribute rather
          # than recomputing the seconds conversion in the template itself
          # - one source of truth, not two.
          - type: markdown
            content: >-
              **Severely restrictive {{ state_attr('__GRIND_BAND_MODERATELY_RESTRICTIVE_MAX__', 'beyond_seconds_hint') }}**

      - type: grid
        cards:
          - type: heading
            heading: Grind deltas
            heading_style: subtitle

          - type: tile
            entity: __GRIND_BAND_GROSSLY_FAST_DELTA__
            name: Grossly fast — Δ
            color: blue
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_MODERATELY_FAST_DELTA__
            name: Moderately fast — Δ
            color: blue
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_SLIGHTLY_FAST_DELTA__
            name: Slightly fast — Δ
            color: blue
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_HEALTHY_DELTA__
            name: Healthy — Δ (fixed)
            color: green
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_SLIGHTLY_RESTRICTIVE_DELTA__
            name: Slightly restrictive — Δ
            color: red
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_MODERATELY_RESTRICTIVE_DELTA__
            name: Moderately restrictive — Δ
            color: red
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __GRIND_BAND_GROSSLY_RESTRICTIVE_DELTA__
            name: Grossly restrictive — Δ
            color: red
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

      - type: grid
        cards:
          - type: heading
            heading: Puck-prep issue streak override
            heading_style: subtitle

          - type: tile
            entity: __PUCK_PREP_ISSUE_STREAK_THRESHOLD__
            name: Streak threshold (shots)
            color: red
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

          - type: tile
            entity: __PUCK_PREP_ISSUE_STREAK_COARSEN_DELTA__
            name: Coarsen Δ
            color: red
            features: *number_buttons
            features_position: bottom
            grid_options:
              columns: 3

      - type: grid
        cards:
          - type: button
            name: Integration settings (configure)
            icon: mdi:cog
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/barista_assist

  - title: Shots
    path: shots
    icon: mdi:history
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Shot history
            heading_style: title
            icon: mdi:history

          - type: custom:barista-assist-shot-history-card
            title: All shots
