title: Barista Assist
views:
  - title: Brew
    path: brew
    icon: mdi:coffee-to-go
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ready to brew
            heading_style: title
            icon: mdi:coffee-to-go

          - type: tile
            entity: __STATUS__
            name: Status
            color: green
            vertical: true

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            color: brown
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date

          - type: tile
            entity: __BEANS_REMAINING__
            name: Beans remaining
            color: brown

      - type: grid
        cards:
          - type: heading
            heading: Recipe
            heading_style: title
            icon: mdi:tune-variant

          - type: tile
            entity: __DOSE__
            name: Dose
            color: amber
            state_content: [state, recommended]
            features: &number_buttons
              - type: numeric-input
                style: buttons
            features_position: bottom

          - type: tile
            entity: __GRIND__
            name: Grind
            color: amber
            state_content: [state, recommended]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TARGET_YIELD__
            name: Target yield
            color: amber
            state_content: [state, recommended]
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TEMPERATURE__
            name: Temperature offset
            color: orange
            state_content: [state, recommended]
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __PREINFUSION__
            name: Pre-infusion
            color: blue
            features: *number_buttons
            features_position: bottom
            visibility:
              - condition: state
                entity: __ADAPT_PI__
                state: "on"

      - type: grid
        cards:
          - type: heading
            heading: Live shot
            heading_style: title
            icon: mdi:chart-line

          - type: custom:barista-assist-live-shot-card
            entity: __STATUS__
            title: Weight & flow rate

          - type: heading
            heading: Controls
            heading_style: title
            icon: mdi:gesture-tap-button

          - type: entities
            show_header_toggle: false
            entities:
              - entity: __BREW__
                name: Brew
              - entity: __TARE__
                name: Tare
              - entity: __ABORT__
                name: Abort

          - type: custom:barista-assist-export-card
            title: Shot data
            button_text: Copy all shot data

      - type: grid
        cards:
          - type: heading
            heading: Last brew
            heading_style: title
            icon: mdi:history

          - type: tile
            entity: __LAST_YIELD__
            name: Last yield
            color: green

          - type: tile
            entity: __SHOT_CLASSIFICATION__
            name: Shot diagnosis
            color: brown

          - type: tile
            entity: __SHOT_CHANNELING_SUSPICION__
            name: Channeling suspicion
            color: red

          - type: entities
            title: Future shot recommendation
            show_header_toggle: false
            entities:
              - entity: __RECOMMENDED_GRIND__
                name: Grind
              - entity: __RECOMMENDED_FLAVOR__
                name: Flavor

  - title: Bags
    path: bags
    icon: mdi:sack
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New physical bag
            heading_style: title
            icon: mdi:package-variant-plus

          - type: markdown
            content: >-
              **Create or replace the selected Normal/Decaf bag.**

              A replacement bag inherits that slot's current recipe. The first bag in an
              empty slot starts at **18.0 g dose / DF54 15 / 7 s PI**, with target yield
              and temperature seeded from the roast level selected below (medium:
              **39.6 g / 0 °C**) - change "New bag roast level" to adjust.

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            features:
              - type: select-options
            features_position: bottom

          - type: entities
            title: Bag details
            show_header_toggle: false
            entities:
              - entity: __NEW_BAG_COFFEE__
                name: New bag coffee
              - entity: __NEW_BAG_ROASTER__
                name: New bag roaster
              - entity: __NEW_BAG_ROAST_DATE__
                name: New bag roast date
              - entity: __NEW_BAG_ROAST_LEVEL__
                name: New bag roast level
              - entity: __NEW_BAG_STARTING_MASS__
                name: New bag starting mass

          - type: tile
            entity: __CREATE_BAG__
            name: Create bag
            color: green
            hide_state: true
            features:
              - type: button
                action_name: Save new bag

      - type: grid
        cards:
          - type: heading
            heading: Current bag
            heading_style: title
            icon: mdi:package-variant-closed

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date
              - opened_at
              - remaining_g

          - type: entities
            title: Current recipe
            show_header_toggle: false
            entities:
              - entity: __DOSE__
                name: Dose
              - entity: __GRIND__
                name: Grind
              - entity: __TARGET_YIELD__
                name: Target yield
              - entity: __TEMPERATURE__
                name: Temperature offset
              - entity: __PREINFUSION__
                name: Adaptive Pre-infusion

  - title: Shots
    path: shots
    icon: mdi:history
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Shot history
            heading_style: title
            icon: mdi:history

          - type: custom:barista-assist-shot-history-card
            title: All shots

  - title: System
    path: system
    icon: mdi:cog-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Barista Assist
            heading_style: title
            icon: mdi:coffee-to-go

          - type: entities
            title: Connection and control
            show_header_toggle: false
            entities:
              - entity: __STATUS__
                name: Status
              - entity: __SCALE_BATTERY__
                name: Scale battery
              - entity: __MACHINE_MAX_SHOT_SECONDS__
                name: Machine max shot duration
              - entity: __SAFETY_MARGIN_SECONDS__
                name: Stop safety margin
              - entity: __ADAPT_PI__
                name: Adapt PI
              - type: conditional
                conditions:
                  - entity: __ADAPT_PI__
                    state: "off"
                row:
                  entity: __MACHINE_PI_SECONDS__
                  name: Machine pre-infusion
              - type: section
                label: Yield Prediction
              - type: section
                label: Stop at weight = target yield - margin; margin = latency * current flow
              - entity: __EARLY_STOP_MARGIN_MIN__
                name: Minimum early stop margin
              - entity: __EARLY_STOP_MARGIN_MAX__
                name: Maximum early stop margin
              - entity: __STOP_LATENCY_NORMAL__
                name: Learned latency (normal flow ~2g/s)
              - entity: __STOP_LATENCY_ELEVATED__
                name: Learned latency (fast flow ~4g/s)
              - type: section
                label: Flavor correction
              - type: section
                label: Smallest adjustment worth making before escalating to the next lever
              - entity: __MIN_STEP_TARGET_YIELD__
                name: Minimum yield adjustment
              - entity: __MIN_STEP_DOSE__
                name: Minimum dose adjustment
              - entity: __MIN_STEP_TEMPERATURE_OFFSET__
                name: Minimum temperature adjustment

      - type: grid
        cards:

          # One entities card, like "Connection and control" above, rather
          # than a grid of separate tile cards - a `type: grid` section's
          # cards are each their own independent card (own background,
          # border, shadow), so they can never visually merge into one
          # unit the way a single card's own rows do. This trades the
          # tile's inline +/- stepper buttons for tap-to-open-more-info
          # editing (the same control style "Connection and control"'s own
          # number entities, e.g. Minimum early stop margin, already use)
          # in exchange for actually looking like one grouped settings
          # card.
          - type: entities
            title: Grind correction
            show_header_toggle: false
            entities:
              - type: section
                label: Duration ratio bands to drive grind change (seconds hints for a 1:2 yield ratio)
              # These rows read top-to-bottom as one ascending
              # duration_ratio ladder (each band's own max: 0.6, 0.75,
              # 0.88...); each boundary value is only ever stored/shown
              # once, on the row above it. seconds_hint/beyond_seconds_hint
              # are computed server-side (runtime_entities.py's
              # _grind_band_seconds_hint/_grind_band_beyond_seconds_hint,
              # off definitions.yaml's live defaults, not a hardcoded
              # constant) and shown as each row's secondary_info - a tile
              # card's `name`/`icon`/`color` can't be templated at all (a
              # rejected HA feature request: https://github.com/
              # home-assistant/frontend/discussions/19930), which is why
              # an earlier version of this section tried and failed to
              # template the hint directly into a tile's own name.
              - entity: __GRIND_BAND_GROSSLY_FAST_MAX__
                name: Grossly fast
                secondary_info: seconds_hint
              - entity: __GRIND_BAND_MODERATELY_FAST_MAX__
                name: Moderately fast
                secondary_info: seconds_hint
              - entity: __GRIND_BAND_SLIGHTLY_FAST_MAX__
                name: Slightly fast
                secondary_info: seconds_hint
              - entity: __GRIND_BAND_HEALTHY_MAX__
                name: Healthy
                secondary_info: seconds_hint
              - entity: __GRIND_BAND_SLIGHTLY_RESTRICTIVE_MAX__
                name: Slightly restrictive
                secondary_info: seconds_hint
              - entity: __GRIND_BAND_MODERATELY_RESTRICTIVE_MAX__
                name: Moderately restrictive
                secondary_info: seconds_hint
              # grossly_restrictive has no max of its own (it's the
              # unbounded catch-all past moderately_restrictive_max - see
              # grind_correction.py's _matched_band_index), so this is a
              # read-only "attribute" row off moderately_restrictive_max's
              # own entity instead of a real editable row.
              - type: attribute
                entity: __GRIND_BAND_MODERATELY_RESTRICTIVE_MAX__
                attribute: beyond_seconds_hint
                name: Severely restrictive

              - type: section
                label: Grind deltas
              - entity: __GRIND_BAND_GROSSLY_FAST_DELTA__
                name: Grossly fast — Δ
              - entity: __GRIND_BAND_MODERATELY_FAST_DELTA__
                name: Moderately fast — Δ
              - entity: __GRIND_BAND_SLIGHTLY_FAST_DELTA__
                name: Slightly fast — Δ
              - entity: __GRIND_BAND_HEALTHY_DELTA__
                name: Healthy — Δ (fixed)
              - entity: __GRIND_BAND_SLIGHTLY_RESTRICTIVE_DELTA__
                name: Slightly restrictive — Δ
              - entity: __GRIND_BAND_MODERATELY_RESTRICTIVE_DELTA__
                name: Moderately restrictive — Δ
              - entity: __GRIND_BAND_GROSSLY_RESTRICTIVE_DELTA__
                name: Grossly restrictive — Δ

              - type: section
                label: Puck-prep issue streak override
              - entity: __PUCK_PREP_ISSUE_STREAK_THRESHOLD__
                name: Streak threshold (shots)
              - entity: __PUCK_PREP_ISSUE_STREAK_COARSEN_DELTA__
                name: Coarsen Δ

      - type: grid
        cards:
          - type: button
            name: Integration settings (configure)
            icon: mdi:cog
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/barista_assist
