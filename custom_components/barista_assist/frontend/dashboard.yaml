title: Barista Assist
views:
  - title: Brew
    path: brew
    icon: mdi:coffee-to-go
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ready to brew
            heading_style: title
            icon: mdi:coffee-to-go

          - type: tile
            entity: __STATUS__
            name: Status
            color: green
            vertical: true

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            color: brown
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date

          - type: tile
            entity: __BEANS_REMAINING__
            name: Beans remaining
            color: brown

      - type: grid
        cards:
          - type: heading
            heading: Recipe
            heading_style: title
            icon: mdi:tune-variant

          - type: tile
            entity: __DOSE__
            name: Dose
            color: amber
            features: &number_buttons
              - type: numeric-input
                style: buttons
            features_position: bottom

          - type: tile
            entity: __GRIND__
            name: Grind
            color: amber
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TARGET_YIELD__
            name: Target yield
            color: amber
            features: *number_buttons
            features_position: bottom

          - type: tile
            entity: __TEMPERATURE__
            name: Temperature offset
            color: orange
            features:
              - type: select-options
            features_position: bottom

          - type: tile
            entity: __PREINFUSION__
            name: Pre-infusion
            color: blue
            features: *number_buttons
            features_position: bottom
            visibility:
              - condition: state
                entity: __ADAPT_PI__
                state: "on"

      - type: grid
        cards:
          - type: heading
            heading: Live shot
            heading_style: title
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            header:
              title: Weight & flow rate
              show: true
            # Both series use data_generator, reading the status sensor's
            # shot_plot attribute (see BaristaRuntime._shot_plot_points)
            # instead of the recorder - it holds the active shot's own
            # samples while one is running (so the chart grows live, anchored
            # to when the shot actually started) and the last completed
            # shot's otherwise. graph_span still has to be set explicitly
            # even though data_generator supplies the actual points: without
            # it, apexcharts-card's default (effectively 24h) x-axis window
            # makes a ~60s shot's worth of real data an imperceptibly thin
            # sliver at the right edge - it just reads as one static dot.
            # This still means a finished shot scrolls out of view after
            # graph_span rather than staying frozen forever.
            graph_span: 60s
            yaxis:
              - id: flow
                opposite: true
                min: -2
                max: 10
                decimals: 1
              - id: weight
                min: 0
                max: 60
                decimals: 0
            series:
              - entity: __STATUS__
                name: Flow rate
                yaxis_id: flow
                color: "#00bcd4"
                opacity: 0.1
                stroke_width: 2
                curve: smooth
                data_generator: |
                  return (entity.attributes.shot_plot || []).map(p => [p[0], p[2]]);
              - entity: __STATUS__
                name: Weight
                yaxis_id: weight
                color: "#2196f3"
                stroke_width: 2
                curve: smooth
                data_generator: |
                  return (entity.attributes.shot_plot || []).map(p => [p[0], p[1]]);

          - type: heading
            heading: Controls
            heading_style: title
            icon: mdi:gesture-tap-button

          - type: entities
            show_header_toggle: false
            entities:
              - entity: __BREW__
                name: Brew
              - entity: __TARE__
                name: Tare
              - entity: __ABORT__
                name: Abort

          - type: custom:barista-assist-export-card
            title: Shot data
            button_text: Copy all shot data

      - type: grid
        cards:
          - type: heading
            heading: Last brew
            heading_style: title
            icon: mdi:history

          - type: tile
            entity: __LAST_YIELD__
            name: Last yield
            color: green

          - type: tile
            entity: __SHOT_CLASSIFICATION__
            name: Shot diagnosis
            color: brown

          - type: tile
            entity: __SHOT_CHANNELING_SUSPICION__
            name: Channeling suspicion
            color: red

  - title: Bags
    path: bags
    icon: mdi:sack
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New physical bag
            heading_style: title
            icon: mdi:package-variant-plus

          - type: markdown
            content: >-
              **Create or replace the selected Normal/Decaf bag.**

              A replacement bag inherits that slot's current recipe. The first bag
              starts at **18.0 g dose / DF54 15 / 36.0 g yield / 0 °C / 7 s PI**.

          - type: tile
            entity: __BEAN_SLOT__
            name: Bean slot
            features:
              - type: select-options
            features_position: bottom

          - type: entities
            title: Bag details
            show_header_toggle: false
            entities:
              - entity: __NEW_BAG_COFFEE__
                name: New bag coffee
              - entity: __NEW_BAG_ROASTER__
                name: New bag roaster
              - entity: __NEW_BAG_ROAST_DATE__
                name: New bag roast date
              - entity: __NEW_BAG_STARTING_MASS__
                name: New bag starting mass

          - type: tile
            entity: __CREATE_BAG__
            name: Create bag
            color: green
            hide_state: true
            features:
              - type: button
                action_name: Save new bag

      - type: grid
        cards:
          - type: heading
            heading: Current bag
            heading_style: title
            icon: mdi:package-variant-closed

          - type: tile
            entity: __ACTIVE_BAG__
            name: Active bag
            color: brown
            state_content:
              - state
              - roaster
              - roast_date
              - opened_at
              - remaining_g

          - type: entities
            title: Current recipe
            show_header_toggle: false
            entities:
              - entity: __DOSE__
                name: Dose
              - entity: __GRIND__
                name: Grind
              - entity: __TARGET_YIELD__
                name: Target yield
              - entity: __TEMPERATURE__
                name: Temperature offset
              - entity: __PREINFUSION__
                name: Pre-infusion

  - title: System
    path: system
    icon: mdi:cog-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Barista Assist
            heading_style: title
            icon: mdi:coffee-to-go

          - type: entities
            title: Connection and control
            show_header_toggle: false
            entities:
              - entity: __STATUS__
                name: Status
              - entity: __SCALE_BATTERY__
                name: Scale battery
              - entity: __EARLY_STOP_MARGIN_MIN__
                name: Minimum early stop margin (stop at weight = target yield - margin)
              - entity: __EARLY_STOP_MARGIN_MAX__
                name: Maximum early stop margin (stop at weight = target yield - margin)
              - entity: __MACHINE_MAX_SHOT_SECONDS__
                name: Machine max shot duration
              - entity: __SAFETY_MARGIN_SECONDS__
                name: Stop safety margin
              - entity: __ADAPT_PI__
                name: Adapt PI
              - type: conditional
                conditions:
                  - entity: __ADAPT_PI__
                    state: "off"
                row:
                  entity: __MACHINE_PI_SECONDS__
                  name: Machine pre-infusion

  - title: Shots
    path: shots
    icon: mdi:history
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Shot history
            heading_style: title
            icon: mdi:history

          - type: custom:barista-assist-shot-history-card
            title: All shots
